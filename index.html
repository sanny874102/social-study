<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>國小五年級社會科（第1、2單元）線上大題庫測驗</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --correct-color: #16a34a;
      --correct-bg: #dcfce7;
      --wrong-color: #dc2626;
      --wrong-bg: #fee2e2;
    }

    body {
      font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      line-height: 1.6;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 850px;
      margin: 0 auto;
    }

    .header-card, .question-card, .result-card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      margin-top: 0;
      color: var(--primary-color);
      font-size: 1.8rem;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 20px;
    }

    .control-panel {
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      padding: 16px;
      border-radius: 8px;
    }

    .share-bar {
      margin-top: 15px;
      padding: 12px;
      background: #e0f2fe;
      border-radius: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      align-items: center;
      font-size: 0.95rem;
    }

    .share-input {
      width: 100%;
      max-width: 360px;
      padding: 8px 12px;
      border: 1px solid #bae6fd;
      border-radius: 6px;
      background: #ffffff;
      color: #0369a1;
      font-family: monospace;
      font-size: 0.95rem;
    }

    select, button {
      font-size: 1rem;
      padding: 10px 16px;
      border-radius: 6px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
    }

    button.btn-primary {
      background-color: var(--primary-color);
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    button.btn-primary:hover {
      background-color: var(--primary-hover);
    }

    button.btn-share {
      padding: 8px 16px;
      background: #0284c7;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    .question-type-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #3730a3;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .passage-box {
      background: #fffbeb;
      border-left: 4px solid #f59e0b;
      padding: 12px 16px;
      margin-bottom: 15px;
      font-size: 0.95rem;
      color: #78350f;
      border-radius: 0 8px 8px 0;
    }

    .question-title {
      font-size: 1.15rem;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-label {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .option-label:hover {
      background: #f1f5f9;
    }

    .option-label input {
      margin-right: 12px;
      transform: scale(1.2);
    }

    .dropdown-select {
      width: 100%;
      max-width: 400px;
      padding: 10px;
      font-size: 1rem;
      border: 2px solid #cbd5e1;
      border-radius: 8px;
    }

    .feedback-box {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      display: none;
      font-weight: bold;
    }

    .feedback-correct {
      background-color: var(--correct-bg);
      color: var(--correct-color);
      border: 1px solid #86efac;
    }

    .feedback-wrong {
      background-color: var(--wrong-bg);
      color: var(--wrong-color);
      border: 1px solid #fca5a5;
    }

    .score-display {
      font-size: 2.2rem;
      font-weight: bold;
      text-align: center;
      color: var(--primary-color);
      margin: 10px 0;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- 頂部設定與控制區 -->
  <div class="header-card">
    <h1>📚 五年級社會科 線上練習大題庫</h1>
    <p class="subtitle">範圍：翰林版 五上 第1、2單元（整合甲卷、乙卷完整題庫）</p>
    
    <div class="control-panel">
      <label for="quizMode"><strong>選擇測驗模式：</strong></label>
      <select id="quizMode">
        <option value="all">挑戰全部題庫（共 69 題）</option>
        <option value="25">隨機抽選 25 題（快速測驗）</option>
        <option value="10">隨機抽選 10 題（每日小練）</option>
      </select>
      <button class="btn-primary" onclick="startQuiz()">開始新測驗</button>
    </div>

    <!-- 專屬網址顯示與一鍵複製列 -->
    <div class="share-bar">
      <span>🌐 <strong>分享測驗網址：</strong></span>
      <input type="text" id="currentUrlInput" class="share-input" readonly />
      <button onclick="copyProjectUrl()" id="copyUrlBtn" class="btn-share">🔗 複製網址</button>
    </div>
  </div>

  <!-- 成績結算區 (預設隱藏) -->
  <div id="resultCard" class="result-card hidden">
    <div class="score-display" id="scoreText">得分：100 分</div>
    <p style="text-align: center;" id="accuracyText">答對題數：0 / 0</p>
  </div>

  <!-- 題目渲染區 -->
  <div id="quizContainer"></div>

  <!-- 底部交卷按鈕 -->
  <div id="submitSection" class="header-card hidden" style="text-align: center;">
    <button class="btn-primary" style="font-size: 1.2rem; padding: 14px 40px;" onclick="submitQuiz()">📝 交卷並查看解析</button>
  </div>
</div>

<script>
// ==========================================
// 0. 專案網址設定 (可依需求調整)
// ==========================================
const OFFICIAL_URL = 'https://sanny874102.github.io/social-study/';

// ==========================================
// 1. 大題庫資料結構 (整合甲卷與乙卷共 69 題)
// ==========================================
const QUESTION_BANK = [
  // --- 甲卷：是非題 ---
  { type: 'tf', source: '甲卷', q: '我們生活的世界可以分為六大洲，包含亞洲、美洲、歐洲、非洲、大洋洲與北極洲。', answer: 'X', exp: '世界分為五大洲，不含北極洲。' },
  { type: 'tf', source: '甲卷', q: '西班牙傳教士在基隆和平島建立教堂，傳播天主教。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '甲卷', q: '目前經政府認定在臺灣的原住民族有十四個族群。', answer: 'X', exp: '目前經政府認定的原住民族有十六個族群。' },
  { type: 'tf', source: '甲卷', q: '三貂角地名是由西班牙語聖地牙哥發音轉化而來。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '甲卷', q: '臺灣與菲律賓距離很近，隔著臺灣海峽。', answer: 'X', exp: '臺灣與菲律賓之間隔著「巴士海峽」。' },
  { type: 'tf', source: '甲卷', q: '臺灣位於南亞海運的中途要道，吸引各族群來此建立據點，臺灣自十六世紀登上國際舞臺。', answer: 'X', exp: '臺灣位於「東亞」海運的中途要道。' },
  { type: 'tf', source: '甲卷', q: '用來驅邪祈福的劍獅，據說其形象源於鄭氏軍隊在盾牌上畫的獅面。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '甲卷', q: '原住民族順應自然環境而生活，像是泰雅族會將竹子建造成房屋或編織為竹器。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '甲卷', q: '新石器時代的人們開始將石頭磨製成石器，並從事農耕。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '甲卷', q: '長濱遺址的人們主要以跨海交易維生。', answer: 'X', exp: '長濱遺址屬於舊石器時代，主要靠捕捉海中生物、採集植物與狩獵維生。' },

  // --- 乙卷：是非題 ---
  { type: 'tf', source: '乙卷', q: '臺南孔廟被稱為「全臺首學」，是清帝國統治臺灣後建立的第一座孔廟。', answer: 'X', exp: '臺南孔廟是「鄭氏政權」時期建立的。' },
  { type: 'tf', source: '乙卷', q: '鄭成功在西元1662年驅逐西班牙人，在臺建立政權。', answer: 'X', exp: '鄭成功驅逐的是「荷蘭人」。' },
  { type: 'tf', source: '乙卷', q: '雅美族(達悟族)人只在每年3～10月食用飛魚，讓飛魚不因人類捕食而滅絕。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '乙卷', q: '南海與臺灣海峽相連，是臺灣與日本間的重要海域。', answer: 'X', exp: '臺灣與日本間的重要海域是「東海」。' },
  { type: 'tf', source: '乙卷', q: '泰雅族舉行小米祈福祭儀時，由祭司為族人祈福。', answer: 'X', exp: '是由「頭目」為族人祈福。' },
  { type: 'tf', source: '乙卷', q: '荷蘭人離開臺灣後，原住民族依舊使用羅馬字母作為書寫工具。', answer: 'O', exp: '正確（即新港文書）。' },
  { type: 'tf', source: '乙卷', q: '荷蘭人從中國招募漢人來臺開墾，再將蔗糖、鹿皮等轉賣到他國。', answer: 'O', exp: '正確。' },
  { type: 'tf', source: '乙卷', q: '史前時代的新石器時代，人們仍只會狩獵與採集植物。', answer: 'X', exp: '新石器時代的人們已知從事農耕與飼養家畜。' },
  { type: 'tf', source: '乙卷', q: '卑南遺址發現琉璃珠，顯示當時已有跨海交易。', answer: 'X', exp: '發現東南亞琉璃珠並顯示有跨海交易的是「十三行遺址」。' },
  { type: 'tf', source: '乙卷', q: '早期臺灣的建築設計會考量氣候，例如：老街的騎樓提供了遮風避雨的功能。', answer: 'O', exp: '正確。' },

  // --- 甲卷：選擇題 ---
  { type: 'mc', source: '甲卷', q: '臺灣適合向東亞各國進行交流或發展貿易，主要是因為下列哪一項因素？', options: ['臺灣四面環海，地理位置適中', '與東亞各國語言相同，容易溝通', '臺灣製造的產品價格便宜品質好', '彼此陸地相連'], answer: '臺灣四面環海，地理位置適中' },
  { type: 'mc', source: '甲卷', q: '臺灣在大航海時代崛起的主要原因是什麼？', options: ['物產豐富', '位於航運要道', '土地肥沃', '人口稀少'], answer: '位於航運要道' },
  { type: 'mc', source: '甲卷', q: '西班牙人佔領淡水後，建造了第二座城堡，後來荷蘭人趕走西班牙人後，在原址重建城堡，就是今日的哪裡？', options: ['聖多明哥城', '聖薩爾瓦多城', '熱蘭遮城', '普羅民遮城'], answer: '聖多明哥城' },
  { type: 'mc', source: '甲卷', q: '西元十六世紀，歐洲國家來到亞洲的主要目的是什麼？', options: ['探索新大陸', '建立軍事據點', '貿易與獲取資源', '研究新生物物種'], answer: '貿易與獲取資源' },
  { type: 'mc', source: '甲卷', q: '如何描述臺灣島的地理位置？', options: ['位於亞洲大陸的東側、太平洋的西側', '位於亞洲大陸的西側、太平洋的東側', '位於亞洲大陸的北側、太平洋的西側', '位於太平洋的南側、亞洲大陸的東側'], answer: '位於亞洲大陸的東側、太平洋的西側' },
  { type: 'mc', source: '甲卷', q: '下列哪一項較可能是來自卑南遺址出土的文物？', options: ['鐮刀', '琉璃珠', '石板棺', '鐵器'], answer: '石板棺' },
  { type: 'mc', source: '甲卷', q: '下列哪一個原住民族主要居住在臺東縣蘭嶼鄉？', options: ['阿美族', '泰雅族', '雅美族(達悟族)', '邵族'], answer: '雅美族(達悟族)' },
  { type: 'mc', source: '甲卷', q: '下列關於史前時代的敘述，哪一項錯誤？', options: ['舊石器時代已知用火', '新石器時代發展農業聚落', '金屬器時代開始煉製鐵器', '長濱遺址的人們生活在地下屋'], answer: '長濱遺址的人們生活在地下屋' },
  { type: 'mc', source: '甲卷', q: '下列哪項不是原住民族生態保育的智慧？', options: ['不可獵殺幼小動物', '限制狩獵時間', '共享與互助的文化', '捕魚時，不將飛魚一網打盡'], answer: '共享與互助的文化' },
  { type: 'mc', source: '甲卷', q: '荷蘭人將什麼動、植物引入臺灣？', options: ['茶葉、黃牛', '龍眼、甘蔗', '土芒果、黃牛', '龍眼、土芒果'], answer: '土芒果、黃牛' },

  // --- 乙卷：選擇題 ---
  { type: 'mc', source: '乙卷', q: '夏季時，臺灣因什麼季風帶來溫暖潮溼的風與大量降雨，對農業與日常生活有重要的影響？', options: ['東北季風', '西北季風', '東南季風', '西南季風'], answer: '西南季風' },
  { type: 'mc', source: '乙卷', q: '荷蘭人在臺灣建立的兩座城堡名稱是什麼？', options: ['熱蘭遮城與聖多明哥城', '普羅民遮城與聖薩爾瓦多城', '聖多明哥城與普羅民遮城', '普羅民遮城與熱蘭遮城'], answer: '普羅民遮城與熱蘭遮城' },
  { type: 'mc', source: '乙卷', q: '荷蘭傳教士如何傳教？', options: ['設立學校和教堂', '招募原住民族開墾', '與中國商人交易', '以上皆是'], answer: '設立學校和教堂' },
  { type: 'mc', source: '乙卷', q: '鄭成功來到臺灣後，在臺南設立什麼，作為行政中心？', options: ['王爺府', '承天府', '代天府', '赤嵌府'], answer: '承天府' },
  { type: 'mc', source: '乙卷', q: '我們可以藉由什麼方式來推測臺灣史前時代人類的生活方式？', options: ['求神問卜', '憑空想像', '出土的文物', '參考其他國家的博物館'], answer: '出土的文物' },
  { type: 'mc', source: '乙卷', q: '清帝國派誰帶兵進攻臺灣，將臺灣納入清帝國版圖？', options: ['劉銘傳', '施琅', '鄭經', '沈葆楨'], answer: '施琅' },
  { type: 'mc', source: '乙卷', q: '下列哪一項是東北季風對臺灣的影響？', options: ['帶來夏季炎熱的氣候', '影響南部冬季使降雨量變少', '增加中部降雨機會', '提高北部與東北部冬季降雨機率'], answer: '提高北部與東北部冬季降雨機率' },
  { type: 'mc', source: '乙卷', q: '在大航海時代，歐洲航海家偶然航行至東亞地區，經過臺灣時，深受島上美麗景色吸引，於是在地圖上記錄此地，並賦予這座島嶼什麼名稱？', options: ['澎湖群島', '福爾摩沙', '臺灣島', '金門群島'], answer: '福爾摩沙' },
  { type: 'mc', source: '乙卷', q: '因為追逐白鹿而發現饒富魚蝦的日月潭，於是全族搬到這裡定居。這是哪一個原住民族的神話傳說？', options: ['邵族', '賽德克族', '雅美族(達悟族)', '西拉雅族'], answer: '邵族' },
  { type: 'mc', source: '乙卷', q: '新石器時代因為什麼原因，帶動人口成長形成聚落？', options: ['石器製作', '文字發明', '食物取得漸趨穩定', '跨國貿易興盛'], answer: '食物取得漸趨穩定' },

  // --- 甲卷：人物與事蹟配對 (下拉選單) ---
  { type: 'dropdown', source: '甲卷', q: '【人物與事蹟配對】在臺南建立熱蘭遮城。', options: ['顏思齊', '鄭成功', '荷蘭人', '西班牙人'], answer: '荷蘭人' },
  { type: 'dropdown', source: '甲卷', q: '【人物與事蹟配對】傳說從北港登陸臺灣，開墾雲林、嘉義一帶。', options: ['顏思齊', '鄭成功', '荷蘭人', '西班牙人'], answer: '顏思齊' },
  { type: 'dropdown', source: '甲卷', q: '【人物與事蹟配對】於西元1662年將荷蘭人趕出臺灣。', options: ['顏思齊', '鄭成功', '荷蘭人', '西班牙人'], answer: '鄭成功' },
  { type: 'dropdown', source: '甲卷', q: '【人物與事蹟配對】派兵進入臺灣的北部，在今日的基隆、淡水等地建立據點。', options: ['顏思齊', '鄭成功', '荷蘭人', '西班牙人'], answer: '西班牙人' },

  // --- 甲卷：史前遺址配對 (下拉選單) ---
  { type: 'dropdown', source: '甲卷', q: '【史前遺址特色】屬於舊石器時代的史前遺址，已知用火燒烤食物。', options: ['卑南遺址', '十三行遺址', '長濱遺址'], answer: '長濱遺址' },

let currentQuestions = [];

// ==========================================
// 2. 測驗啟動與題目渲染邏輯
// ==========================================
function shuffleArray(array) {
  const arr = [...array];
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function startQuiz() {
  const mode = document.getElementById('quizMode').value;
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('submitSection').classList.remove('hidden');

  if (mode === 'all') {
    currentQuestions = [...QUESTION_BANK];
  } else {
    const count = parseInt(mode, 10);
    currentQuestions = shuffleArray(QUESTION_BANK).slice(0, count);
  }

  renderQuestions();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function getTypeName(type) {
  switch (type) {
    case 'tf': return '是非題';
    case 'mc': return '單選題';
    case 'dropdown': return '下拉配合題';
    case 'checkbox': return '複選題';
    default: return '題目';
  }
}

function renderQuestions() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';

  currentQuestions.forEach((item, index) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q-card-${index}`;

    let html = `<span class="question-type-badge">${getTypeName(item.type)}（出處：${item.source}）</span>`;

    if (item.passage) {
      html += `<div class="passage-box">${item.passage}</div>`;
    }

    html += `<div class="question-title">${index + 1}. ${item.q}</div>`;

    if (item.type === 'tf') {
      html += `
        <div class="options-list">
          <label class="option-label">
            <input type="radio" name="q_${index}" value="O"> ◯ 是（正確）
          </label>
          <label class="option-label">
            <input type="radio" name="q_${index}" value="X"> ✕ 非（錯誤）
          </label>
        </div>
      `;
    } else if (item.type === 'mc') {
      html += `<div class="options-list">`;
      item.options.forEach(opt => {
        html += `
          <label class="option-label">
            <input type="radio" name="q_${index}" value="${opt}"> ${opt}
          </label>
        `;
      });
      html += `</div>`;
    } else if (item.type === 'dropdown') {
      html += `<select class="dropdown-select" id="q_${index}">`;
      html += `<option value="">-- 請點此選擇正確答案 --</option>`;
      item.options.forEach(opt => {
        html += `<option value="${opt}">${opt}</option>`;
      });
      html += `</select>`;
    } else if (item.type === 'checkbox') {
      html += `<div class="options-list">`;
      item.options.forEach(opt => {
        html += `
          <label class="option-label">
            <input type="checkbox" name="q_${index}" value="${opt}"> ${opt}
          </label>
        `;
      });
      html += `</div>`;
    }

    html += `<div id="feedback_${index}" class="feedback-box"></div>`;

    card.innerHTML = html;
    container.appendChild(card);
  });
}

// ==========================================
// 3. 交卷與自動批改邏輯
// ==========================================
function submitQuiz() {
  let correctCount = 0;
  const total = currentQuestions.length;

  currentQuestions.forEach((item, index) => {
    const feedbackEl = document.getElementById(`feedback_${index}`);
    let isCorrect = false;
    let userAnsText = '未作答';

    if (item.type === 'tf' || item.type === 'mc') {
      const selected = document.querySelector(`input[name="q_${index}"]:checked`);
      if (selected) {
        userAnsText = selected.value;
        isCorrect = (selected.value === item.answer);
      }
    } else if (item.type === 'dropdown') {
      const selectEl = document.getElementById(`q_${index}`);
      if (selectEl && selectEl.value !== '') {
        userAnsText = selectEl.value;
        isCorrect = (selectEl.value === item.answer);
      }
    } else if (item.type === 'checkbox') {
      const checkedBoxes = Array.from(document.querySelectorAll(`input[name="q_${index}"]:checked`)).map(cb => cb.value);
      if (checkedBoxes.length > 0) {
        userAnsText = checkedBoxes.join('、');
      }
      const sortedUser = [...checkedBoxes].sort();
      const sortedAns = [...item.answer].sort();
      isCorrect = (sortedUser.length === sortedAns.length) && sortedUser.every((val, i) => val === sortedAns[i]);
    }

    feedbackEl.style.display = 'block';
    const stdAnsText = Array.isArray(item.answer) ? item.answer.join('、') : item.answer;
    const expText = item.exp ? `<br><small>💡 補充解析：${item.exp}</small>` : '';

    if (isCorrect) {
      correctCount++;
      feedbackEl.className = 'feedback-box feedback-correct';
      feedbackEl.innerHTML = `✅ 答對了！標準答案：${stdAnsText}${expText}`;
    } else {
      feedbackEl.className = 'feedback-box feedback-wrong';
      feedbackEl.innerHTML = `❌ 答錯了（你的作答：${userAnsText}）。<br>👉 正確答案應為：<strong>${stdAnsText}</strong>${expText}`;
    }
  });

  const finalScore = Math.round((correctCount / total) * 100);
  document.getElementById('scoreText').innerText = `測驗得分：${finalScore} 分`;
  document.getElementById('accuracyText').innerText = `答對題數：${correctCount} 題 ／ 共 ${total} 題`;
  document.getElementById('resultCard').classList.remove('hidden');

  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 4. 顯示並複製 sanny874102/social-study 網址邏輯
// ==========================================
function initUrlDisplay() {
  const urlInput = document.getElementById('currentUrlInput');
  // 若在線上環境則讀取當前網址，若在本地端預覽則直接顯示你的 GitHub Pages 官方網址
  if (window.location.href.startsWith('http')) {
    urlInput.value = window.location.href;
  } else {
    urlInput.value = OFFICIAL_URL;
  }
}

function copyProjectUrl() {
  const urlInput = document.getElementById('currentUrlInput');
  const copyBtn = document.getElementById('copyUrlBtn');

  navigator.clipboard.writeText(urlInput.value).then(() => {
    copyBtn.innerText = '✅ 已複製！';
    copyBtn.style.backgroundColor = '#16a34a';
    
    setTimeout(() => {
      copyBtn.innerText = '🔗 複製網址';
      copyBtn.style.backgroundColor = '#0284c7';
    }, 2000);
  }).catch(() => {
    urlInput.select();
    document.execCommand('copy');
    alert('已複製網址：' + urlInput.value);
  });
}

// 網頁載入時初始化測驗與網址列
window.onload = function() {
  startQuiz();
  initUrlDisplay();
};
</script>

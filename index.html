<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級自然科學 線上練習大題庫（翰林版）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-seedling"></i> 五年級自然科學 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：翰林版 五上 第 1、2 單元（完整收錄總題庫 + 期中考卷 + 單元卷 + 素養閱讀題組）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[260px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg cursor-pointer">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">答對：0 題（目前得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目與素養情境 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200 cursor-pointer">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
                <p id="final-detail" class="text-slate-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 cursor-pointer">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/natural-science-hanlin05/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0 cursor-pointer">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 題庫資料結構：單題與「不切割素養題組 (GROUP)」整合
        const allQuestionUnits = [
            // ================= 一、單一獨立題目 (是非題 / 選擇題) =================
            { type: "TF", q: "進行植物的分類時，無論利用哪一種分類依據，最後的分類結果都一定會相同。", ans: false, explanation: "不一定。依據不同的分類標準（如生長環境、葉脈或開花與否），分類結果會不同。" },
            { type: "TF", q: "自然界的植物五花八門，各有各的樣貌和姿態。", ans: true, explanation: "自然界植物種類繁多，有各自不同的外形特徵與生長方式。" },
            { type: "TF", q: "大萍和布袋蓮都是陸生植物。", ans: false, explanation: "大萍和布袋蓮都是生長在水面上的漂浮性「水生植物」。" },
            { type: "TF", q: "自己製作太陽高度角觀測器時，只要確認吸管是直立的就好，不需要檢查是否與地面垂直。", ans: false, explanation: "吸管必須與地面（底板）保持垂直，測出的太陽高度角才會準確。" },
            { type: "TF", q: "水分從植物的根吸收進入植物體，經由莖輸送到葉子，最後從葉子蒸散出去。", ans: true, explanation: "植物體內水分運輸的方向為：根吸收→莖輸送→葉蒸散。" },
            { type: "TF", q: "太陽光射入三稜鏡後，我們可以看到像彩虹一樣的七彩色光。", ans: true, explanation: "太陽光通過三稜鏡會因折射而分散成紅、橙、黃、綠、藍、靛、紫等彩虹色光。" },
            { type: "TF", q: "雨過天晴時，天上的彩虹會出現在太陽的相反方向。", ans: true, explanation: "陽光照射空氣中的小水滴經折射與反射形成彩虹，彩虹會出現在太陽的相反方向。" },
            { type: "TF", q: "不同季節的日出時刻和日落時刻都不太相同。", ans: true, explanation: "夏至日出最早、日落最晚（白晝最長）；冬至日出最晚、日落最早（白晝最短）。" },
            { type: "TF", q: "在臺灣，夏季的太陽高度角會比冬季的太陽高度角大，因此氣溫也會比較高。", ans: true, explanation: "太陽高度角會影響氣溫變化，夏季太陽高度角大（較直射），氣溫較高。" },
            { type: "TF", q: "一年之中，每天上午 6 時看到太陽升起的位置都相同。", ans: false, explanation: "不同。一年中太陽升起的位置與時間會隨季節改變（例如春分秋分在正東、夏至東偏北、冬至東偏南）。" },
            { type: "TF", q: "同一時間、地點，夏天的太陽高度角會比冬天的大。", ans: true, explanation: "夏天太陽的運行軌跡偏北且較高，故同一時間的太陽高度角比冬天大。" },
            { type: "TF", q: "適當的照射太陽光，可產生身體需要的維生素 C。", ans: false, explanation: "適當照射太陽光可幫助人體合成所需的「維生素 D」，而非維生素 C。" },
            { type: "TF", q: "進行植物分類時，只要有共同特徵的植物就有可能被分在同一類。", ans: true, explanation: "依據分類方式，相同特徵愈多，愈可能被分在同一類。" },
            { type: "TF", q: "金桔的果實是在金桔花授粉成功後，由子房發育而成。", ans: true, explanation: "花朵授粉後，雌蕊的子房會發育成果實，胚珠則發育成種子。" },
            { type: "TF", q: "我們晒太陽的好處之一，是可以合成人體所需的維生素 A。", ans: false, explanation: "晒太陽可以幫助人體合成所需的「維生素 D」，而非維生素 A。" },
            { type: "TF", q: "太陽直射時的氣溫，會比太陽斜射時的氣溫高。", ans: true, explanation: "陽光直射時單位面積接收到的熱能比斜射時多，因此氣溫較高。" },
            { type: "TF", q: "同一種植物可能有多種的繁殖方式。", ans: true, explanation: "例如甘藷可以利用塊根、莖或種子進行繁殖；落地生根可用葉或種子繁殖。" },
            { type: "TF", q: "只要是陣雨過後，在天空中一定可以看到彎彎的彩虹出現。", ans: false, explanation: "不一定。除了空氣中有小水滴外，還必須有陽光照射且觀察角度（背對太陽）配合才看得到。" },
            { type: "TF", q: "太陽能光電板可以將太陽的光轉換成電能使用，例如：太陽能路燈提供照明。", ans: true, explanation: "太陽能光電板能將太陽光能轉換為電能儲存並供路燈照明。" },
            { type: "TF", q: "太陽的方位與影子的方位相反。", ans: true, explanation: "光線沿直線前進，當物體擋住陽光時，會在太陽的相反方向形成影子。" },
            { type: "TF", q: "大花咸豐草的果實有倒勾刺，會鉤附在人的衣物或動物身上來傳播種子。", ans: true, explanation: "大花咸豐草（鬼針草）果實前端有倒鉤刺，可藉由鉤附在動物或人身上傳播。" },
            { type: "TF", q: "太陽是地球生命能量的來源，可以讓地球上的生物生生不息。", ans: true, explanation: "太陽提供光與熱，讓植物行光合作用並維持地球溫暖，是生命能量的來源。" },
            { type: "TF", q: "進行「植物體內水分輸送」實驗時，在水中滴入紅色的水溶液，是為了可以方便觀察水在植物體內的變化。", ans: true, explanation: "有顏色的水溶液被植物吸收後會將運送部位染紅，較容易被觀察。" },
            { type: "TF", q: "太陽能光電板設置在屋頂上，可以用來遮陽和發電。", ans: true, explanation: "屋頂架設太陽能光電板既能吸收光能發電，也能阻擋陽光直接照射屋頂達到降溫遮陽效果。" },
            { type: "TF", q: "甘藷除了可以利用種子繁殖外，也可以利用莖或根來繁殖。", ans: true, explanation: "甘藷用塊根繁殖時下方長根、上方長新芽；以莖扦插繁殖時，土壤裡的節長根、上方的節長新枝葉。" },
            { type: "TF", q: "一天中，丹丹從太陽升起就開始觀測陽光下電線桿的影子變化，發現桿影會由長慢慢變短，直到太陽落下。", ans: false, explanation: "一天中，上午竿影會由長慢慢變短，但「中午過後會由短慢慢變長」直到太陽落下。" },
            { type: "TF", q: "下午 4 時測量太陽高度角，夏天測得的太陽高度角會比冬天測得的大。", ans: true, explanation: "夏天太陽運行的軌跡偏北，同一時刻的太陽高度角較冬天大。" },
            { type: "TF", q: "一年中，同一時間的太陽高度角以 12 月 22 日前後的最大。", ans: false, explanation: "一年中同一時間的太陽高度角以「6 月 21 日（夏至）前後」最大，12 月 22 日（冬至）前後最小。" },
            { type: "TF", q: "一年中，每天相同時間測量太陽高度角，從 3 月到 6 月，所測得的太陽高度角會愈來愈大。", ans: true, explanation: "從 3 月（春分）到 6 月（夏至）之間，太陽每日運行軌跡逐漸偏北，太陽高度角愈來愈大。" },
            { type: "TF", q: "奶奶用放大鏡來看報紙，是透過光的折射現象，讓字變得更大、更清楚。", ans: true, explanation: "放大鏡（凸透鏡）利用光線穿過空氣與玻璃不同介質時的折射現象，形成正立放大影像。" },
            { type: "TF", q: "大萍的葉片裡具有通氣組織可儲存空氣，讓大萍浮於水面。", ans: true, explanation: "大萍的葉片肥厚且內部有通氣組織儲存空氣，使整株植物能漂浮在水面上。" },
            { type: "MC", q: "臺中市某國小的校園裡有不少的大萍、布袋蓮，我們可以推測校園裡可能有什麼環境？", options: ["大草坪", "防風林", "山坡", "池塘"], ans: 3, explanation: "大萍和布袋蓮是校園「池塘」常見的漂浮性水生植物。" },
            { type: "MC", q: "一天當中，太陽在天空的位置會隨著時間而改變，太陽的移動路線為何？", options: ["東升西落", "西升東落", "南升北落", "北升南落"], ans: 0, explanation: "因地球由西向東自轉，一天中太陽在天空中的位置呈現「東升西落」。" },
            { type: "MC", q: "植物生長所需的能量來源是什麼？", options: ["陽光", "蜜蜂", "蚯蚓", "礦物質"], ans: 0, explanation: "植物利用「陽光」進行光合作用製造生長所需的養分。" },
            { type: "MC", q: "將吸管放入裝水的玻璃杯裡，可以觀察到下列哪一種現象？", options: ["吸管變長了", "吸管折彎了", "吸管不見了", "沒有變化"], ans: 1, explanation: "由於光從水中進入空氣發生折射，水中的吸管看起來好像折彎（或斷掉）了。" },
            { type: "MC", q: "下列哪一種能源是屬於綠能，可以減少消耗地球上的資源？", options: ["石油", "天然氣", "核能", "太陽能"], ans: 3, explanation: "「太陽能」是乾淨、無汙染且可再生的綠色能源。" },
            { type: "MC", q: "蒲公英是藉由下列哪一種方式傳播種子的？", options: ["水力", "自身彈力", "風力", "動物"], ans: 2, explanation: "蒲公英的果實帶有冠毛（絨毛），可隨「風力」四處飄散傳播。" },

            // ================= 二、素養題組 (GROUP：抽題時整組帶走不拆開) =================
            {
                type: "GROUP",
                context: "【素養閱讀情境一：小明的植物水分傳遞與蒸散實驗】\n小明將一株帶有葉片的芹菜插入裝有紅色水溶液的燒杯中，並在芹菜上方套上一透明夾鏈袋封緊，放在陽光下觀察一小時。",
                questions: [
                    {
                        type: "MC",
                        q: "1. 一小時後夾鏈袋內壁出現無色透明的小水滴，這個現象主要證明了植物的哪一種生理作用？",
                        options: ["光合作用", "呼吸作用", "蒸散作用", "消化作用"],
                        ans: 2,
                        explanation: "植物體內的水分經由葉片蒸散出來凝結成無色小水滴，屬於蒸散作用。"
                    },
                    {
                        type: "TF",
                        q: "2. 將芹菜莖橫切後，發現切面上有被染紅的點狀構造，說明水分在植物體內的運輸方向是由上往下。",
                        ans: false,
                        explanation: "水分運輸的方向是由下往上（根/基部 → 莖 → 葉）。"
                    },
                    {
                        type: "MC",
                        q: "3. 實驗中使用紅色水溶液的主要目的為何？",
                        options: ["提供植物營養", "方便觀察水分在莖內運輸的路線", "促進光合作用", "防止蟲害"],
                        ans: 1,
                        explanation: "加入色素可以清楚觀察到水在植物莖部組織中被運送的路徑。"
                    }
                ]
            },
            {
                type: "GROUP",
                context: "【素養閱讀情境二：陽光與太陽高度角觀測】\n阿光在學校操場進行「太陽高度角與影子」的觀測記錄，分別在上午 9:00、中午 12:00 及下午 3:00 記錄竿影方向與高度角度數。",
                questions: [
                    {
                        type: "MC",
                        q: "1. 下列哪一個時刻所測得的太陽高度角度數通常會最大？",
                        options: ["上午 9:00", "中午 12:00", "下午 3:00", "三個時刻都一樣"],
                        ans: 1,
                        explanation: "一天之中，通常在中午 12 點左右太陽位置最高，高度角最大。"
                    },
                    {
                        type: "TF",
                        q: "2. 下午 3:00 時，阿光發現竿影指向東北方，由此可推斷太陽此時位於西南方。",
                        ans: true,
                        explanation: "影子的方位必定與太陽方位相反。"
                    }
                ]
            },
            {
                type: "GROUP",
                context: "【素養閱讀情境三：日本山荷葉（透明花）與光的折射】\n日本山荷葉原本開白花，但淋雨沾水後花瓣會變得幾乎透明！因為花瓣表面布滿微小空隙，當水填滿空隙時，光線不再被散射而是直接穿透並發生「折射現象」。",
                questions: [
                    {
                        type: "MC",
                        q: "1. 下列哪一個日常現象或應用與「透明花」的光學原理最類似？",
                        options: ["利用放大鏡看放大字體", "在陽光下看到自己的影子", "用黑布遮光使房間變暗", "照鏡子看到自己的影像"],
                        ans: 0,
                        explanation: "透明花與放大鏡都是利用光線穿過不同介質時產生的「折射現象」。"
                    },
                    {
                        type: "TF",
                        q: "2. 花瓣變透明是因為光線斜向穿過水與花瓣介質時產生了折射現象。",
                        ans: true,
                        explanation: "光線穿過不同介質時改變行進方向，為折射原理的應用。"
                    }
                ]
            },
            {
                type: "GROUP",
                context: "【素養閱讀情境四：紅樹林水筆仔胎生苗】\n水筆仔生活在海邊潮溼、鹽分高、土壤鬆軟且含氧量低的紅樹林泥灘，種子若直接掉落地面極難發芽。因此水筆仔演化出「胎生現象」：種子先在母樹果實上發芽長成筆狀胎生苗，累積養分後才掉落。",
                questions: [
                    {
                        type: "MC",
                        q: "1. 水筆仔發育出胎生苗構造的主要目的為何？",
                        options: ["吸引鳥類前來食用", "適應泥濘缺氧與高鹽分的環境", "減少葉片水分蒸散", "抵抗高山強風"],
                        ans: 1,
                        explanation: "胎生苗在母樹上累積足夠養分後才掉落，能大幅提高在泥濘缺氧環境下的存活率。"
                    },
                    {
                        type: "TF",
                        q: "2. 胎生苗內部含有空氣，掉落水中後可以漂浮並隨海水傳播到遠方。",
                        ans: true,
                        explanation: "胎生苗內部的通氣組織含有空氣，有助於浮在水面上藉水力傳播。"
                    }
                ]
            }
        ];

        let quizQuestions = [];
        let currentIndex = 0;
        let score = 0;

        // 隨機抽題邏輯：保證素養題組整體被選入，不被中途切斷
        function prepareQuiz(selectedTarget) {
            let shuffledUnits = [...allQuestionUnits].sort(() => Math.random() - 0.5);
            let selectedQuestions = [];

            if (selectedTarget === 'all') {
                shuffledUnits.forEach(unit => {
                    if (unit.type === 'GROUP') {
                        unit.questions.forEach(q => selectedQuestions.push({ ...q, context: unit.context }));
                    } else {
                        selectedQuestions.push(unit);
                    }
                });
            } else {
                let targetCount = parseInt(selectedTarget, 10);
                for (let unit of shuffledUnits) {
                    if (selectedQuestions.length >= targetCount) break;

                    if (unit.type === 'GROUP') {
                        // 素養題組完整收錄，不將組內題目截斷
                        unit.questions.forEach(q => {
                            selectedQuestions.push({ ...q, context: unit.context });
                        });
                    } else {
                        selectedQuestions.push(unit);
                    }
                }
            }
            return selectedQuestions;
        }

        function startQuiz() {
            const countVal = document.getElementById("question-count").value;
            quizQuestions = prepareQuiz(countVal);
            
            currentIndex = 0;
            score = 0;

            document.getElementById("setup-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");

            renderCurrentQuestion();
        }

        function renderCurrentQuestion() {
            const q = quizQuestions[currentIndex];
            const container = document.getElementById("question-container");
            const explanationBox = document.getElementById("explanation-box");
            const nextBtn = document.getElementById("next-btn");

            explanationBox.classList.add("hidden");
            nextBtn.classList.add("hidden");

            document.getElementById("progress-text").innerText = `題目 ${currentIndex + 1} / ${quizQuestions.length}`;
            document.getElementById("score-text").innerText = `答對：${score} 題（目前得分：${Math.round((score / quizQuestions.length) * 100 || 0)} 分）`;

            let html = '';

            // 若該題屬於素養題組，顯示情境背景框
            if (q.context) {
                html += `
                    <div class="bg-amber-50 border-l-4 border-amber-400 p-4 rounded-r-xl mb-4 text-slate-800 text-sm md:text-base font-medium whitespace-pre-line">
                        ${q.context}
                    </div>
                `;
            }

            html += `<div class="text-lg md:text-xl font-bold text-slate-800 mb-3">${q.q}</div>`;

            if (q.type === 'TF') {
                html += `
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="checkAnswer(true)" class="opt-btn py-3 px-4 bg-slate-100 hover:bg-blue-50 border border-slate-300 rounded-xl font-bold text-blue-600 text-lg transition cursor-pointer">○ 正確</button>
                        <button onclick="checkAnswer(false)" class="opt-btn py-3 px-4 bg-slate-100 hover:bg-red-50 border border-slate-300 rounded-xl font-bold text-red-600 text-lg transition cursor-pointer">✕ 錯誤</button>
                    </div>
                `;
            } else if (q.type === 'MC') {
                html += `<div class="space-y-2.5">`;
                q.options.forEach((opt, idx) => {
                    html += `
                        <button onclick="checkAnswer(${idx})" class="opt-btn w-full text-left py-3 px-4 bg-slate-100 hover:bg-blue-50 border border-slate-300 rounded-xl font-medium text-slate-700 transition cursor-pointer">
                            (${idx + 1}) ${opt}
                        </button>
                    `;
                });
                html += `</div>`;
            }

            container.innerHTML = html;
        }

        function checkAnswer(userAns) {
            const q = quizQuestions[currentIndex];
            const isCorrect = userAns === q.ans;
            const buttons = document.querySelectorAll(".opt-btn");

            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score++;
            }

            document.getElementById("score-text").innerText = `答對：${score} 題（目前得分：${Math.round((score / quizQuestions.length) * 100)} 分）`;
            document.getElementById("explanation-text").innerText = q.explanation;
            document.getElementById("explanation-box").classList.remove("hidden");
            document.getElementById("next-btn").classList.remove("hidden");
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < quizQuestions.length) {
                renderCurrentQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");

            const finalPct = Math.round((score / quizQuestions.length) * 100);
            document.getElementById("final-score").innerText = `總得分：${finalPct} 分`;
            document.getElementById("final-detail").innerText = `答對 ${score} 題 / 共 ${quizQuestions.length} 題`;
        }

        function resetQuiz() {
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById("setup-screen").classList.remove("hidden");
        }

        function copyUrl() {
            const urlInput = document.getElementById("share-url");
            urlInput.select();
            document.execCommand("copy");
            alert("網址已成功複製到剪貼簿！");
        }
    </script>
</body>
</html>

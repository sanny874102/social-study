<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>五年級社會科 線上練習大題庫（翰林版）</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-book-open"></i> 五年級社會科 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：翰林版 五上 第 1、2 單元（100% 完整收錄 5 份單元卷 + 期中考甲、乙卷所有題型）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[260px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="50">挑戰 50 題（考前實力衝刺）</option>
                        <option value="all" selected>挑戰全部完整題庫（共 165 題）</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">答對：0 題（目前得分：0 分）</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
                <p id="final-detail" class="text-slate-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/social-study/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 完整收錄 7 份試卷（共 165 題）的題庫與詳解
        const allQuestions = [
            // ================= 一、是非題（整合 7 份考卷） =================
            // 1. 第1單元第1課：從地圖探索位置與發展有何關聯
            { type: "TF", q: "世界可以分為亞洲、美洲、歐洲、非洲與大洋洲五大洲，而我們所在的臺灣是亞洲的一部分。", ans: true, explanation: "世界分為五大洲，臺灣位於亞洲大陸東側，屬於亞洲的一部分。" },
            { type: "TF", q: "世界的海域可以分為三大洋，分別是太平洋、大西洋、印度洋。", ans: true, explanation: "世界主要海域分為太平洋、大西洋與印度洋三大洋。" },
            { type: "TF", q: "400多年前，歐洲國家所繪製的世界地圖比現今的地圖更精確。", ans: false, explanation: "現今透過衛星與現代測量技術繪製的地圖，比400多年前的手繪古地圖更精確。" },
            { type: "TF", q: "臺灣四面環海，因受海洋阻隔，無法與鄰近地區進行文化交流與貿易。", ans: false, explanation: "臺灣四面環海且位於東亞海運要道，反而能透過海洋與鄰近地區進行熱絡的文化交流與貿易。" },
            { type: "TF", q: "欣欣說：「臺灣是個美麗寶島，四季的氣候變化不會受到季風氣候的影響。」她的說法是正確的。", ans: false, explanation: "臺灣的氣候深受季風影響（夏季吹西南季風、冬季吹東北季風）。" },
            { type: "TF", q: "王叔叔喜歡吃黑鮪魚生魚片，他可以在夏季的時候到屏東東港品嘗。", ans: true, explanation: "每年初夏（約4～6月）黑鮪魚會順著洋流經過臺灣南部海域，屏東東港是著名的黑鮪魚產地。" },
            { type: "TF", q: "我國現在的範圍包含臺灣島和周圍的離島，總面積約為36,000平方公里。", ans: true, explanation: "臺灣本島加上澎湖、金門、馬祖等周圍離島，總面積約為36,000平方公里。" },
            { type: "TF", q: "小銘的爺爺在整理老照片，爺爺對小銘說：「早期臺灣的老街在一樓會有騎樓的設計，為的是讓民眾可以躲雨和天氣炎熱時可以不被太陽晒，滿足日常活動需求。」", ans: true, explanation: "騎樓能遮陽擋雨，是早期居民因應臺灣多雨炎熱氣候所發展出的建築智慧。" },

            // 2. 第1單元第2課：史前人們如何善用資源維持生活
            { type: "TF", q: "我們可以藉由研究先民使用過的器物，了解過去人們的生活狀況。", ans: true, explanation: "史前時代沒有文字，考古學家主要透過出土的遺物與遺跡來了解先民的生活狀況。" },
            { type: "TF", q: "臺灣四面環海，因此史前時代的居民完全依賴海洋資源，沒有發展其他生活方式。", ans: false, explanation: "史前居民除了利用海洋資源外，也會在陸地上採集植物、狩獵動物，到了新石器時代更發展出農耕與飼養家畜。" },
            { type: "TF", q: "長濱遺址是在臺灣東部地區的山頂上被發現的。", ans: false, explanation: "長濱遺址（八仙洞）是在臺東縣長濱鄉的海蝕洞穴中被發現的，並非山頂上。" },
            { type: "TF", q: "我們可以從卑南遺址出土的陶器推測當時已有儲放物品的生活智慧。", ans: true, explanation: "新石器時代的人們懂得燒製陶器，用來汲水、烹煮食物與儲放物品。" },
            { type: "TF", q: "考古學家可以透過文字紀錄推測史前人們的生活方式。", ans: false, explanation: "史前時代尚未發展出文字，沒有文字紀錄可供參考，必須透過出土文物來推測。" },
            { type: "TF", q: "位於臺東的八仙洞遺址屬於舊石器時代的遺址。", ans: true, explanation: "臺東長濱鄉的八仙洞遺址（長濱文化）是臺灣著名的舊石器時代代表遺址。" },
            { type: "TF", q: "臺灣島上居民的生活與海洋息息相關，是因為臺灣地理位置的緣故。", ans: true, explanation: "臺灣四面環海，海洋資源豐富且位處航運要道，使居民生活與海洋密不可分。" },
            { type: "TF", q: "隨著時代變遷，刀器的製作方式或材質也會產生變化。", ans: true, explanation: "從舊石器時代的打製石器、新石器時代的磨製石刀，到金屬器時代的鐵器，工具材質與技術不斷演進。" },

            // 3. 第1單元第3課：原住民族的文化與環境有何關聯
            { type: "TF", q: "泰雅族只在11月至4月間狩獵，讓動物有繁殖生長的時間。", ans: true, explanation: "限制狩獵季節讓動物在春夏季能安心繁殖生長，展現原住民族生態保育的智慧。" },
            { type: "TF", q: "臺灣的原住民族中，唯一居住在離島的是泰雅族。", ans: false, explanation: "唯一主要居住在離島（臺東縣蘭嶼鄉）的原住民族是「雅美族（達悟族）」。" },
            { type: "TF", q: "原住民族部落的重要事務都由頭目決定。", ans: false, explanation: "原住民族部落的重要事務（如舉行祭典）通常會透過「部落會議」共同討論決議，並由全體族人共同承擔。" },
            { type: "TF", q: "娃郁的爺爺每年都會在部落祭典中帶領族人祈福，他的身分可能是頭目或祭司。", ans: true, explanation: "在原住民族部落中，通常由頭目或祭司在重要祭典中帶領族人向祖靈或神明祈福。" },
            { type: "TF", q: "原住民族透過神話傳說、歌謠、祭典等方式，來傳承傳統文化。", ans: true, explanation: "原住民族過去沒有文字，主要藉由口耳相傳的神話傳說、歌謠與歲時祭儀來傳承歷史與文化。" },
            { type: "TF", q: "玉茹若在4月到蘭嶼旅遊，不僅有機會看到雅美族(達悟族)人下海捕捉飛魚，還能夠品嘗飛魚特色料理。", ans: true, explanation: "每年約3～6月是蘭嶼的飛魚季，雅美族（達悟族）人會出海捕撈飛魚。" },
            { type: "TF", q: "臺灣的原住民族目前經政府認定的有16個族群。", ans: true, explanation: "目前經政府官方認定的臺灣原住民族共有16族。" },
            { type: "TF", q: "原住民族的狩獵禁忌大都與生態保育有關。", ans: true, explanation: "例如禁止獵殺幼小動物、規定狩獵季節等禁忌，都是為了讓自然資源永續發展。" },

            // 4. 第2單元第1課：臺灣為什麼在大航海時代崛起
            { type: "TF", q: "阿達打算趁著週末走訪大航海時代的熱蘭遮城，他的目的地就是臺南赤嵌樓。", ans: false, explanation: "熱蘭遮城是今日的「安平古堡」；「赤嵌樓」則是當年的普羅民遮城。" },
            { type: "TF", q: "傳說顏思齊是從今日雲林縣北港鎮登陸臺灣，所以後人在此地設立紀念碑。", ans: true, explanation: "顏思齊率眾來臺開墾笨港（今雲林北港與嘉義新港一帶），北港圓環設有顏思齊開臺紀念碑。" },
            { type: "TF", q: "荷蘭人來到臺灣後，以臺南作為根據地，先後建立熱蘭遮城和普羅民遮城作為行政與商業中心。", ans: true, explanation: "荷蘭人於大員（今臺南安平）建熱蘭遮城作為統治中心，後於赤嵌建普羅民遮城作為商業與行政中心。" },
            { type: "TF", q: "美玉這次的社會科研究報告的對象是「延平郡王」，蒐集資料時她可以查找關於施琅的生平故事。", ans: false, explanation: "「延平郡王」是指「鄭成功」，而非施琅。" },
            { type: "TF", q: "荷蘭人敗給鄭氏政權軍隊，最終在西元1662年退出臺灣。", ans: true, explanation: "西元1662年鄭成功擊敗荷蘭東印度公司，結束荷蘭人在臺38年的統治。" },
            { type: "TF", q: "荷蘭人在臺灣期間，中國正面臨戰亂紛爭，最後清帝國滅亡，明帝國建立。", ans: false, explanation: "當時是「明帝國」滅亡，「清帝國」建立（明末清初）。" },
            { type: "TF", q: "鄭成功率領軍隊來臺，最初的目的是為了拓展貿易版圖。", ans: false, explanation: "鄭成功率軍攻臺最初的目的是為了尋找「反清復明」的基地與糧食補給據點。" },
            { type: "TF", q: "現今我們到臺灣北部，仍可以看到大航海時代歐洲人留下的建築。", ans: true, explanation: "例如新北市淡水的紅毛城（原聖多明哥城遺址重建）與基隆和平島遺址。" },

            // 5. 第2單元第2課：大航海時代在臺灣留下哪些影響
            { type: "TF", q: "基隆和平島教堂遺址出土的十字架，是荷蘭人在臺灣傳教時留下的遺跡。", ans: false, explanation: "基隆和平島是「西班牙人」建立據點與傳播天主教的地方，因此是西班牙人留下的遺跡。" },
            { type: "TF", q: "臺灣東北角海岸的「三貂角」地名，是由西班牙語聖地牙哥的發音轉化而來。", ans: true, explanation: "1626年西班牙艦隊航經臺灣東北角，將此地命名為「聖地牙哥」（San Diego），後轉化為「三貂角」。" },
            { type: "TF", q: "漢人移民來臺開墾，也將故鄉的傳統習俗與生活方式帶進臺灣。", ans: true, explanation: "漢人移民來臺時，將原鄉的宗教信仰（如媽祖、玄天上帝）、飲食與節慶習俗一併傳入臺灣。" },
            { type: "TF", q: "希希很喜歡吃豌豆炒蝦仁這道料理，媽媽告訴她：「豌豆是由荷蘭人引進臺灣，所以又稱為荷蘭豆。」媽媽的說法是正確的。", ans: true, explanation: "荷蘭治臺時期引進了豌豆（荷蘭豆）、高麗菜、番茄、土芒果等作物。" },
            { type: "TF", q: "臺灣最早的基督教信仰是由荷蘭人來臺而傳入。", ans: true, explanation: "荷蘭人信仰基督教（新教），來臺時派傳教士向原住民族傳播基督教信仰。" },
            { type: "TF", q: "由於荷蘭人與鄭氏政權在臺期間，禁止漢人來臺開墾，使得漢人移民人數十分稀少。", ans: false, explanation: "荷蘭人為了種植甘蔗與稻米曾招募漢人來臺，鄭氏政權更積極推動軍民屯墾，使漢人數量大幅增加。" },
            { type: "TF", q: "臺灣傳統農業有使用黃牛耕田的習慣，是因鄭氏政權時期將黃牛引進臺灣。", ans: false, explanation: "黃牛是由「荷蘭人」引進臺灣以協助開墾耕作的。" },
            { type: "TF", q: "鄭氏政權在臺灣期間，與清帝國正處於戰爭狀態，因此只能以走私貿易的方式來交易物品。", ans: true, explanation: "當時清帝國實施海禁政策封鎖鄭氏政權，鄭氏只能透過走私貿易取得中國的絲綢、瓷器等物資。" },
            { type: "TF", q: "在荷蘭人統治臺灣之前，已有不少漢人在臺從事漁業和貿易活動。", ans: true, explanation: "大航海時代初期，已有許多漢人漁民、商旅及海商（如顏思齊、鄭芝龍）在臺灣沿海活動。" },

            // 6. 期中考 乙卷 與 甲卷 是非題
            { type: "TF", q: "臺南孔廟被稱為「全臺首學」，是清帝國統治臺灣後建立的第一座孔廟。", ans: false, explanation: "臺南孔廟是「鄭氏政權時期」（鄭經採納陳永華建議）建立的第一座孔廟。" },
            { type: "TF", q: "鄭成功在西元1662年驅逐西班牙人，在臺建立政權。", ans: false, explanation: "鄭成功在1662年驅逐的是「荷蘭人」（西班牙人早在1642年已被荷蘭人驅逐）。" },
            { type: "TF", q: "雅美族(達悟族)人只在每年3~10月食用飛魚，讓飛魚不因人類捕食而滅絕。", ans: true, explanation: "雅美族人遵守傳統歲時祭儀，在特定季節捕撈與食用飛魚，讓海洋資源得以生生不息。" },
            { type: "TF", q: "南海與臺灣海峽相連，是臺灣與日本間的重要海域。", ans: false, explanation: "臺灣與日本、南韓間的重要海域是位於臺灣北邊的「東海」。" },
            { type: "TF", q: "泰雅族舉行小米祈福祭儀時，由祭司為族人祈福。", ans: false, explanation: "泰雅族舉行小米祈福祭儀時，是由部落的「頭目」為族人祈福。" },
            { type: "TF", q: "荷蘭人離開臺灣後，原住民族依舊使用羅馬字母作為書寫工具。", ans: true, explanation: "荷蘭傳教士以羅馬字母拼寫西拉雅語（新港文書），荷蘭人離臺後原住民族仍持續使用超過百年。" },
            { type: "TF", q: "荷蘭人從中國招募漢人來臺開墾，再將蔗糖、鹿皮等轉賣到他國。", ans: true, explanation: "荷蘭人招募漢人來臺種植甘蔗、稻米，並將蔗糖與鹿皮外銷日本等地。" },
            { type: "TF", q: "史前時代的新石器時代，人們仍只會狩獵與採集植物。", ans: false, explanation: "新石器時代的人們已經懂得磨製石器、燒製陶器，並開始從事「農耕」與飼養家畜。" },
            { type: "TF", q: "卑南遺址發現琉璃珠，顯示當時已有跨海交易。", ans: false, explanation: "發現來自東南亞的琉璃珠與煉鐵技術是「十三行遺址」的特色；卑南遺址以石板棺與臺灣玉器著稱。" },
            { type: "TF", q: "早期臺灣的建築設計會考量氣候，例如：老街的騎樓提供了遮風避雨的功能。", ans: true, explanation: "騎樓設計能遮陽避雨，非常適合臺灣多雨且夏季炎熱的氣候。" },
            { type: "TF", q: "我們生活的世界可以分為六大洲，包含亞洲、美洲、歐洲、非洲、大洋洲與北極洲。", ans: false, explanation: "世界分為五大洲（亞洲、美洲、歐洲、非洲、大洋洲），不包含北極洲。" },
            { type: "TF", q: "西班牙傳教士在基隆和平島建立教堂，傳播天主教。", ans: true, explanation: "西班牙人占領北臺灣時，在基隆和平島建立聖薩爾瓦多城與教堂，傳播天主教。" },
            { type: "TF", q: "目前經政府認定在臺灣的原住民族有十四個族群。", ans: false, explanation: "目前經政府認定的臺灣原住民族共有「十六」個族群。" },
            { type: "TF", q: "臺灣與菲律賓距離很近，隔著臺灣海峽。", ans: false, explanation: "臺灣南邊與菲律賓隔著「巴士海峽」；西邊與中國大陸才是隔著臺灣海峽。" },
            { type: "TF", q: "臺灣位於南亞海運的中途要道，吸引各族群來此建立據點，臺灣自十六世紀登上國際舞臺。", ans: false, explanation: "臺灣位於「東亞」海運的中途要道，連接東北亞與東南亞。" },
            { type: "TF", q: "用來驅邪祈福的劍獅，據說其形象源於鄭氏軍隊在盾牌上畫的獅面。", ans: true, explanation: "相傳鄭氏軍隊盾牌上繪有獅面，士兵返家將盾牌與刀劍掛在牆上，演變為安平避邪祈福的「劍獅」。" },
            { type: "TF", q: "原住民族順應自然環境而生活，像是泰雅族會將竹子建造成房屋或編織為竹器。", ans: true, explanation: "泰雅族善於就地取材，利用山林中的竹子建造竹屋、引水或編織生活器具。" },
            { type: "TF", q: "新石器時代的人們開始將石頭磨製成石器，並從事農耕。", ans: true, explanation: "磨製石器、燒製陶器與發展農耕是新石器時代的重要特徵。" },
            { type: "TF", q: "長濱遺址的人們主要以跨海交易維生。", ans: false, explanation: "長濱遺址屬於舊石器時代，人們主要靠捕捉海中生物、採集植物與狩獵維生。" },

            // ================= 二、選擇題（整合 7 份考卷） =================
            // 1. 第1單元第1課：從地圖探索位置與發展有何關聯
            { type: "MC", q: "阿文要在地圖上尋找臺灣的位置，他可以先找到世界上最大的陸地，然後在它的哪一側找到臺灣？", options: ["南側", "北側", "東側", "西側"], ans: 2, explanation: "世界上最大的陸地是亞洲大陸（歐亞大陸），臺灣位於亞洲大陸的「東側」。" },
            { type: "MC", q: "下列哪一個海域介於臺灣、大洋洲和美洲之間呢？", options: ["臺灣海峽", "太平洋", "大西洋", "印度洋"], ans: 1, explanation: "臺灣東側緊鄰世界最大的海洋「太平洋」，介於亞洲、大洋洲與美洲之間。" },
            { type: "MC", q: "臺灣擁有海洋地理位置的優勢，這個優勢無法促進什麼產業的發展？", options: ["觀光", "航運", "漁業", "採礦"], ans: 3, explanation: "四面環海的地理優勢有助於發展航運、漁業與海洋觀光，但與陸地「採礦」無直接關聯。" },
            { type: "MC", q: "我國現今的範圍不包括下列哪一個地方？", options: ["釣魚臺列嶼", "沖繩群島", "南沙群島", "澎湖群島"], ans: 1, explanation: "沖繩群島（琉球群島）屬於日本領土，不在我國範圍內。" },
            { type: "MC", q: "下列哪個地方是觀察黑面琵鷺生態的最佳地點？", options: ["新北市淡水區", "臺南市七股區", "屏東縣東港鎮", "屏東縣恆春鎮"], ans: 1, explanation: "每年秋冬黑面琵鷺會飛到溫暖的臺灣西南沿海度冬，「臺南市七股區」曾文溪口溼地是最佳觀察地點。" },
            { type: "MC", q: "東北季風通常是在什麼時候經過海洋帶來水氣，讓臺灣北部和東北部容易降雨？", options: ["6月中~9月中", "5月中~7月中", "8月~9月", "10月初~隔年4月中"], ans: 3, explanation: "每年約10月初至隔年4月中為冬半年，盛行東北季風，經過海面帶來水氣使北部、東北部容易降雨。" },
            { type: "MC", q: "芸潔和爸爸、媽媽參加旅行社辦的三天二夜行程，爸爸說：「冬天降雨量少，可以不需要帶雨具，比較方便。」請問：芸潔一家可能是參加到哪裡的旅遊行程？", options: ["高雄", "宜蘭", "臺北", "基隆"], ans: 0, explanation: "冬季盛行東北季風，北部與東北部（臺北、基隆、宜蘭）迎風面多雨，而南部（高雄）背風面則乾燥少雨。" },
            { type: "MC", q: "大航海時代，許多歐洲國家繪製世界地圖的主要目的是什麼？", options: ["航海與貿易", "藝術創作", "科學實驗", "發展觀光"], ans: 0, explanation: "歐洲國家為了尋找新航路與進行海外貿易，積極繪製更準確的航海與世界地圖。" },
            { type: "MC", q: "朴義是來自南韓的觀光客，他搭乘飛機到臺灣時會穿越哪一個海域？", options: ["南海", "東海", "臺灣海峽", "巴士海峽"], ans: 1, explanation: "南韓位於臺灣北方，搭機來臺會穿越臺灣北邊的「東海」。" },

            // 2. 第1單元第2課：史前人們如何善用資源維持生活
            { type: "MC", q: "考古學家根據下列何者推測新石器時代的臺灣島內存在著器物交換？", options: ["當時普遍已懂得從事農耕", "有多處遺址都有出現產於花蓮的臺灣玉", "當時使用陶器已是相當常見的現象", "當時人們已會磨製石器"], ans: 1, explanation: "全臺多處遺址皆出土僅產於花蓮豐田的「臺灣玉」，證明當時島內已有廣泛的器物交換與交易。" },
            { type: "MC", q: "哪一項不是劃分「新石器時代」與「舊石器時代」的依據？", options: ["石器製作的方式", "是否有農業活動", "是否飼養家畜", "是否懂得用火"], ans: 3, explanation: "舊石器時代（如長濱遺址）與新石器時代的人類都已經懂得用火，因此「是否懂得用火」不是區分兩者的依據。" },
            { type: "MC", q: "史前時代人類在器具的製作上，依出現時間的先後排序，哪一項正確？", options: ["陶器→石器→金屬器", "石器→金屬器→陶器", "石器→陶器→金屬器", "陶器→金屬器→石器"], ans: 2, explanation: "舊石器時代先使用「石器」，新石器時代開始燒製「陶器」，最後進入「金屬器」時代。" },
            { type: "MC", q: "從新石器時代的卑南遺址中，不可能看到什麼物品？", options: ["石刀", "石板棺", "陶器", "金屬鐮刀"], ans: 3, explanation: "卑南遺址屬於新石器時代，當時尚未出現「金屬鐮刀」（金屬器到金屬器時代才出現）。" },
            { type: "MC", q: "當我們走在東部地區的海岸邊，遙想舊石器時代人類的生活情況，會是什麼景象？", options: ["以敲擊方式製造石器", "過著以農業為主的生活", "會與外地的人進行跨海交易", "會製作陶器來儲放物品"], ans: 0, explanation: "舊石器時代（如長濱遺址）的人們主要以「敲擊（打製）方式製造石器」，過著採集與漁獵生活。" },
            { type: "MC", q: "哪一個史前遺址的人們還沒有出現種植農作物的跡象？", options: ["長濱遺址", "十三行遺址", "卑南遺址", "芝山岩遺址"], ans: 0, explanation: "「長濱遺址」屬於舊石器時代，尚未發展出農業；卑南與芝山岩為新石器時代，十三行為金屬器時代。" },
            { type: "MC", q: "哪一個史前遺址的人類最早已知用火？", options: ["卑南遺址", "長濱遺址", "十三行遺址", "芝山岩遺址"], ans: 1, explanation: "舊石器時代的「長濱遺址」是目前臺灣已知最早懂得用火燒烤食物與取暖的遺址。" },

            // 3. 第1單元第3課：原住民族的文化與環境有何關聯
            { type: "MC", q: "原住民族部落會議決議舉行祭典的事務後，會由誰一起共同承擔責任？", options: ["只有頭目", "部落會議的參與者", "所有部落成員", "只有祭司"], ans: 2, explanation: "部落會議做成決議後，會由「所有部落成員」分工合作、共同承擔責任。" },
            { type: "MC", q: "泰雅族的歲時祭儀主要是跟下列哪兩項生產活動有關呢？（A農業、B畜牧、C商業、D狩獵）", options: ["AB（農業、畜牧）", "AD（農業、狩獵）", "CD（商業、狩獵）", "BC（畜牧、商業）"], ans: 1, explanation: "原住民族的傳統歲時祭儀主要與「農業」（如小米播種、收穫）和「狩獵」生產活動息息相關。" },
            { type: "MC", q: "依據考古研究，原住民族的祖先很可能早在什麼時候就已遷徙到臺灣了？", options: ["史前時代", "大航海時代", "清帝國時期", "民國時期"], ans: 0, explanation: "考古研究顯示，原住民族的祖先早在「史前時代」就已經在臺灣這塊土地上生活。" },
            { type: "MC", q: "邵族祖先意外發現有物產富饒的地方進而定居，是因為他們當時在進行何種生產活動？", options: ["種田", "狩獵", "織布", "探險"], ans: 1, explanation: "邵族「白鹿傳說」中，祖先是因為在山林裡「狩獵」追逐白鹿，才意外發現魚蝦豐富的日月潭。" },
            { type: "MC", q: "從雅美族(達悟族)只在固定期間捕捉飛魚的傳統，可以看出他們的祖先具有什麼樣的智慧？", options: ["生態保育", "人定勝天", "互助合作", "商業利益"], ans: 0, explanation: "限制捕撈季節讓魚群能夠繁衍，展現了珍惜自然資源與「生態保育」的智慧。" },
            { type: "MC", q: "泰雅族的哪一個傳統文化表現出他們重視互助合作的精神？", options: ["組成「共勞團體」", "禁止捕殺幼小的動物", "用竹子取水引水", "有狩獵期間的限制"], ans: 0, explanation: "泰雅族人組成「共勞團體」與「共食團體」，共同耕作、狩獵並分享成果，展現互助合作精神。" },
            { type: "MC", q: "下列哪一項原住民族的傳統文化與自然共存的智慧無關？", options: ["捕捉飛魚時不趕盡殺絕", "有狩獵期間的限制", "禁止獵殺幼小的動物", "組成共勞團體"], ans: 3, explanation: "「組成共勞團體」屬於部落社會共享互助的組織文化，與自然生態保育較無直接關聯。" },

            // 4. 第2單元第1課：臺灣為什麼在大航海時代崛起
            { type: "MC", q: "歐洲國家透過新航路來到亞洲，建立據點與哪些國家進行貿易？", options: ["中國、美國", "中國、日本", "日本、美國", "美國、印度"], ans: 1, explanation: "大航海時代歐洲國家來到東亞海域，主要想與「中國、日本」進行絲綢、瓷器與白銀等貿易。" },
            { type: "MC", q: "佐藤是大航海時代的日本武士，他想要訂製一套舒適的武士服，他可以使用當時進口的什麼物資製作呢？", options: ["銀", "絲綢", "鹿皮", "瓷器"], ans: 2, explanation: "當時臺灣盛產梅花鹿，「鹿皮」質地柔韌，大量外銷至日本作為製作武士服與甲冑的材料。" },
            { type: "MC", q: "臺灣在大航海時代成為歐洲各國競逐對象的原因是什麼？", options: ["科技發展領先世界", "位於東亞海運的中途要道", "建設完善", "物產貧乏"], ans: 1, explanation: "臺灣位於東亞海運的中途要道，地理位置優越，因此成為歐洲各國建立貿易轉運站的競逐目標。" },
            { type: "MC", q: "鄭經過世後，內部因爭奪政權而紛爭不斷，清帝國趁機派下列哪一個人進攻臺灣？", options: ["陳永華", "鄭芝龍", "施琅", "顏思齊"], ans: 2, explanation: "1683年清帝國派水師提督「施琅」率軍攻臺，鄭克塽投降，結束鄭氏政權統治。" },
            { type: "MC", q: "鄭氏軍隊攻臺，最後選擇從下列哪一個地方登陸？", options: ["鹿耳門", "澎湖", "鹿港", "淡水"], ans: 0, explanation: "西元1661年鄭成功大軍趁漲潮通過臺南「鹿耳門」港道進入臺江內海登陸。" },
            { type: "MC", q: "在大航海時代，除了漢人，還有什麼人會來到臺灣呢？", options: ["日本人", "荷蘭人", "西班牙人", "以上皆是"], ans: 3, explanation: "大航海時代有漢人、日本人、荷蘭人與西班牙人等先後在臺灣進行貿易或建立據點。" },
            { type: "MC", q: "歐洲各國進入東亞海域後，紛紛尋找貿易活動的據點，請問荷蘭人首先在下列哪一個地方設立據點？", options: ["印尼", "南韓", "日本", "菲律賓"], ans: 0, explanation: "荷蘭人在亞洲首先於「印尼」的巴達維亞（今雅加達）設立東印度公司亞洲總部據點。" },

            // 5. 第2單元第2課：大航海時代在臺灣留下哪些影響
            { type: "MC", q: "臺南孔廟最早是在臺灣的什麼時期建立的？", options: ["荷蘭人在臺時期", "西班牙人在臺時期", "鄭氏政權時期", "清帝國時期"], ans: 2, explanation: "臺南孔廟建於「鄭氏政權時期」（西元1665年），是全臺第一座孔廟，號稱全臺首學。" },
            { type: "MC", q: "下列何者不是鄭氏政權在臺灣期間透過貿易所進口的物品？", options: ["軍火物資", "絲綢", "瓷器", "鹿皮"], ans: 3, explanation: "「鹿皮」與蔗糖是臺灣當時生產並「出口」外銷的商品；軍火、絲綢與瓷器則是進口的物資。" },
            { type: "MC", q: "志華和家人上週末到臺南遊玩，並到北極殿參拜，請問北極殿主要供奉的是什麼神明？", options: ["虎爺", "玄天上帝", "土地公", "媽祖"], ans: 1, explanation: "臺南北極殿建於鄭氏時期，主要供奉明朝與鄭氏政權的守護神「玄天上帝」（北極真武大帝）。" },
            { type: "MC", q: "鄭氏政權透過什麼方式，來奠定漢人社會與文化在臺灣的發展？", options: ["推行文教", "發展貿易", "發動戰爭", "引進國外農作物"], ans: 0, explanation: "鄭氏政權興建孔廟、設立學校並舉辦科舉考試，透過「推行文教」奠定漢人社會文化的基礎。" },

            { type: "MC", q: "荷蘭人在臺灣建立的兩座城堡名稱是什麼？", options: ["熱蘭遮城與聖多明哥城", "普羅民遮城與聖薩爾瓦多城", "聖多明哥城與普羅民遮城", "普羅民遮城與熱蘭遮城"], ans: 3, explanation: "荷蘭人在臺南先後建立了「熱蘭遮城」（安平古堡）與「普羅民遮城」（赤嵌樓）。" },

            { type: "MC", q: "清帝國派誰帶兵進攻臺灣，將臺灣納入清帝國版圖？", options: ["劉銘傳", "施琅", "鄭經", "沈葆楨"], ans: 1, explanation: "清帝國派遣「施琅」攻克臺灣，並採納其建議將臺灣納入版圖。" },

            { type: "MC", q: "在大航海時代，歐洲航海家偶然航行至東亞地區，經過臺灣時，深受島上美麗景色吸引，於是在地圖上記錄此地，並賦予這座島嶼什麼名稱？", options: ["澎湖群島", "福爾摩沙", "臺灣島", "金門群島"], ans: 1, explanation: "葡萄牙航海家航經臺灣時讚嘆美麗之島「Formosa」（福爾摩沙），並標註於地圖上。" },
            { type: "MC", q: "因為追逐白鹿而發現饒富魚蝦的日月潭，於是全族搬到這裡定居。這是哪一個原住民族的神話傳說？", options: ["邵族", "賽德克族", "雅美族(達悟族)", "西拉雅族"], ans: 0, explanation: "追逐白鹿發現日月潭是南投「邵族」著名的祖先遷徙傳說。" },

            { type: "MC", q: "臺灣在大航海時代崛起的主要原因是什麼？", options: ["物產豐富", "位於航運要道", "土地肥沃", "人口稀少"], ans: 1, explanation: "因為「位於航運要道」，吸引歐洲各國及海商前來建立貿易據點。" },

            { type: "TF", q: "【神話與祭典】原住民族的神話傳說展現了臺灣多元文化的特色。", ans: true, explanation: "各族群豐富的神話傳說與生活智慧，是臺灣多元文化的重要瑰寶。" },

            { type: "TF", q: "【荷蘭與西班牙在臺比較】大航海時代，西班牙人攻打荷蘭人，迫使荷蘭人離開臺灣。", ans: false, explanation: "是西元1642年「荷蘭人北上攻打西班牙人」，迫使西班牙人離開臺灣。" },
            { type: "TF", q: "【荷蘭與西班牙在臺比較】荷蘭人與西班牙人都以臺灣作為貿易據點，也都在臺灣建設堡壘（城堡）。", ans: true, explanation: "兩國皆看中臺灣的地理位置而建立貿易據點，並興建熱蘭遮城、聖薩爾瓦多城等堡壘。" },
            { type: "MC", q: "【西班牙撤離原因】西班牙人和荷蘭人曾在臺灣一北一南設立據點，為什麼後來西班牙人逐漸減少對其據點的重視，最終被迫撤離呢？", options: ["來臺後對外貿易效果不佳，所得經費無法好好維持據點", "受到日本軍隊直接登陸攻打", "船隊數量過於龐大無法停靠", "臺灣北部發生嚴重火山爆發"], ans: 0, explanation: "由於日本鎖國等因素，西班牙人在北臺灣對外貿易成效不佳，經費不足以維持據點而裁減駐軍，最終遭荷蘭人擊敗撤離。" },
            { type: "MC", q: "【大航海時代東方商品】大航海時代，歐洲國家積極前往海外探險，透過新航路來到亞洲，主要是為了尋找東方的哪些物品？", options: ["瓷器、香料、絲織品", "石油、煤炭、汽車", "玉米、番薯、馬鈴薯", "黃牛、土芒果、豌豆"], ans: 0, explanation: "當時歐洲人熱衷於尋找東方的「香料、絲織品（絲綢）與瓷器」以賺取高額利潤。" },

            { type: "MC", q: "【荷蘭文教影響】荷蘭人為了傳教，不但設立教堂與學校，還以什麼字母來拼寫原住民族語言（新港文書）？", options: ["羅馬字母", "注音符號", "漢字", "日文假名"], ans: 0, explanation: "荷蘭傳教士以「羅馬字母」拼寫西拉雅語等原住民族語言，翻譯聖經並教導原住民書寫。" },
            { type: "TF", q: "【鄭氏時期情景】阿崗是生長於鄭氏政權時期的漢人移民，他在當時可能看到「第一座孔廟被設立」、「漢人移民傳入媽祖信仰」以及「貿易蓬勃發展」的情景。", ans: true, explanation: "鄭氏時期興建全臺首座孔廟、漢人移民帶來媽祖與玄天上帝信仰，並積極發展海上貿易。" },
            { type: "TF", q: "【鄭氏時期情景】阿崗是生長於鄭氏政權時期的漢人移民，他在當時會看到「很多荷蘭人受到招募而來到臺灣開墾」。", ans: false, explanation: "當時受到招募來臺開墾的是中國東南沿海的「漢人」，而非荷蘭人。" },
            { type: "MC", q: "【大航海時代宗教】大航海時代是臺灣宗教齊發的時間點，下列哪一組是由「中國漢人移民」帶入臺灣的信仰神祇？", options: ["玄天上帝、媽祖", "基督教、天主教", "飛魚之神、祖靈", "阿拉、耶穌"], ans: 0, explanation: "漢人移民渡海來臺時，帶入了「媽祖、玄天上帝、保生大帝、開漳聖王」等傳統神祇信仰。" },

            // 6. 期中考 乙卷 第三、四、五、六、七大題（氣候配對、素養題、史前與原住民代號、問答）
            { type: "MC", q: "【臺灣氣候特徵】關於臺灣「夏季氣候」的敘述，下列哪一組配對是正確的？", options: ["受西南季風影響、氣候溼熱多雨", "受東北季風影響、北部氣候溼冷", "受西南季風影響、全臺寒冷乾燥", "受東北季風影響、全臺炎熱少雨"], ans: 0, explanation: "臺灣夏季受「西南季風」影響，全臺普遍呈現「溼熱多雨」的氣候特徵。" },
            { type: "MC", q: "【臺灣氣候特徵】關於臺灣「冬季氣候」的敘述，下列哪一組配對是正確的？", options: ["受西南季風影響、氣候溼熱多雨", "受東北季風影響、北部氣候溼冷", "受東南季風影響、南部氣候溼冷", "受西北季風影響、全臺高溫多雨"], ans: 1, explanation: "臺灣冬季受「東北季風」影響，迎風面的「北部與東北部氣候溼冷」，中南部則溫暖少雨。" },
            { type: "MC", q: "【閱讀素養題：荷蘭貿易】小美參觀了臺南的安平古堡和赤嵌樓，了解十六、十七世紀時荷蘭人利用臺灣地理優勢發展國際貿易。請問當時荷蘭人在臺灣發展貿易，最主要的輸出商品是什麼？", options: ["鹿皮與蔗糖", "金礦與茶葉", "稻米與香蕉", "煤礦與玉米"], ans: 0, explanation: "荷蘭治臺時期最主要的兩大出口商品為「鹿皮」（銷往日本）與「蔗糖」（銷往日本、波斯等地）。" },
            { type: "MC", q: "【閱讀素養題：荷蘭貿易】荷蘭人治理臺灣時，如何對待當地的原住民族？", options: ["尊重他們的文化並能完全平等共處", "要求原住民族服從命令，以控制當地資源與勞動力", "互不干涉彼此的貿易活動", "與原住民族共同平分臺灣貿易利潤"], ans: 1, explanation: "荷蘭人透過武力與地方會議「要求原住民族服從命令」，以控制土地資源與勞動力。" },
            { type: "MC", q: "【閱讀素養題：荷蘭貿易】小美參訪後反思，當時臺灣成為國際貿易的重要據點，對今日臺灣社會有何影響？", options: ["讓臺灣成為多元文化的社會", "沒有很大的影響，現代貿易不會參考過去經驗", "臺灣農業產業完全消失", "臺灣成為全球面積最大貿易國"], ans: 0, explanation: "大航海時代各國族群與漢人來臺交流，讓臺灣逐漸發展成「多元文化的社會」。" },
            { type: "MC", q: "【史前時代特色】「用鐵製鋤頭種田，提高作物產量。」這是哪一個史前時代的特色？", options: ["舊石器時代", "新石器時代", "金屬器時代", "文字時代"], ans: 2, explanation: "使用鐵製農具（鐵器）屬於「金屬器時代」的特色。" },
            { type: "MC", q: "【史前時代特色】「開始運用石器從事農耕，種植芋頭與稻米等作物，並開始飼養家畜，形成聚落。」這是哪一個史前時代的特色？", options: ["舊石器時代", "新石器時代", "金屬器時代", "資訊時代"], ans: 1, explanation: "從事農耕、飼養家畜並形成定居聚落，是「新石器時代」的特色。" },
            { type: "MC", q: "【史前時代特色】「以狩獵、採集植物及捕捉海中生物維生，敲擊石頭製成工具，且最早已知用火來燒烤食物及取暖。」這是哪一個史前時代的特色？", options: ["舊石器時代", "新石器時代", "金屬器時代", "大航海時代"], ans: 0, explanation: "敲擊製石、採集狩獵與最早已知用火，是「舊石器時代」的特色。" },
            { type: "MC", q: "【原住民族文化哲學】「部落祭典主要與狩獵和農業生產有關。」這屬於原住民族哪一方面的文化展現？", options: ["取材自然", "共享互助", "歲時祭儀", "海洋貿易"], ans: 2, explanation: "配合四季農耕與狩獵時節所舉辦的部落祭典，稱為「歲時祭儀」。" },
            { type: "MC", q: "【原住民族文化哲學】「用竹子或木頭建造房屋，以及利用竹子取水引水、製作食器。」這屬於原住民族哪一方面的生活智慧？", options: ["取材自然", "共享互助", "歲時祭儀", "跨海交易"], ans: 0, explanation: "善用周遭山林環境中的竹子、木頭、石板來建屋與製器，展現了「取材自然」的智慧。" },
            { type: "MC", q: "【原住民族文化哲學】「有共食團體分享獵物，是穩定部落與凝聚族群的力量。」這屬於原住民族哪一方面的生活哲學？", options: ["取材自然", "共享互助", "歲時祭儀", "階級統治"], ans: 1, explanation: "共勞、共食與分享獵物，展現了原住民族「共享互助」、凝聚族群向心力的精神。" },
            { type: "MC", q: "【問答觀念：史前資源運用】史前時代的人們如何運用自然資源維持生活？下列哪一個例子正確？", options: ["捕捉海中生物維生，或運用石器從事農耕", "使用塑膠魚網捕魚，並駕駛動力漁船", "進口國外的罐頭食品維生", "利用網路查詢天氣再出海捕魚"], ans: 0, explanation: "史前人類善用自然資源，如在海邊捕捉魚貝類、在陸地採集狩獵，或用石器開墾從事農耕。" },
            { type: "MC", q: "【問答觀念：泰雅族生態智慧】泰雅族長期以山林為生活環境，發展出與自然和諧共處的生活方式，下列哪兩項是正確的例子？", options: ["狩獵時避免獵殺幼小動物、只在特定季節狩獵讓動物繁殖生長", "全年無休大量捕捉飛魚、建造地下屋防颱", "在日月潭追逐白鹿、完全不進行任何狩獵活動", "引進黃牛與荷蘭豆、大量開闢甘蔗園外銷"], ans: 0, explanation: "泰雅族遵守Gaga規範，狩獵時不獵殺幼小動物，並限制在秋冬季節（11~4月）狩獵，讓動物能繁衍生長。" },

            { type: "MC", q: "【歷史人物與事蹟】請問「在臺南建立熱蘭遮城」的是下列何者？", options: ["顏思齊", "鄭成功", "荷蘭人", "西班牙人"], ans: 2, explanation: "「荷蘭人」於1624年在臺南安平建立熱蘭遮城。" },
            { type: "MC", q: "【歷史人物與事蹟】請問「傳說從北港登陸臺灣，開墾雲林、嘉義一帶」的是下列何者？", options: ["顏思齊", "鄭成功", "荷蘭人", "西班牙人"], ans: 0, explanation: "海商「顏思齊」傳說從笨港（北港）登陸，率眾開墾雲嘉一帶。" },

            { type: "MC", q: "【歷史人物與事蹟】請問「派兵進入臺灣的北部，在今日的基隆、淡水等地建立據點」的是下列何者？", options: ["顏思齊", "鄭成功", "荷蘭人", "西班牙人"], ans: 3, explanation: "「西班牙人」於1626年進入北臺灣，在基隆與淡水建立據點。" },
            { type: "MC", q: "【史前遺址配對】「屬於舊石器時代的史前遺址，已知用火燒烤食物，且主要以敲擊的方式製作石器。」這是哪一個遺址？", options: ["卑南遺址", "十三行遺址", "長濱遺址", "芝山岩遺址"], ans: 2, explanation: "臺東「長濱遺址」屬舊石器時代，以敲擊製石、已知用火為特色。" },
            { type: "MC", q: "【史前遺址配對】「屬於新石器時代的史前遺址，用石刀收割農作物、使用石板組成石棺，並曾出土兩個把手的陶罐。」這是哪一個遺址？", options: ["卑南遺址", "十三行遺址", "長濱遺址", "八仙洞遺址"], ans: 0, explanation: "臺東「卑南遺址」屬新石器時代，以石刀、石板棺與雙把陶罐聞名。" },
            { type: "MC", q: "【史前遺址配對】「為金屬器時代的代表遺址，顯示當時已有煉鐵技術，並出土來自東南亞的琉璃珠，顯示有跨海交易。」這是哪一個遺址？", options: ["卑南遺址", "十三行遺址", "長濱遺址", "八仙洞遺址"], ans: 1, explanation: "新北八里「十三行遺址」屬金屬器時代，以煉鐵技術與跨海交易的琉璃珠著稱。" },
            { type: "MC", q: "【閱讀素養題：烏魚與氣候】阿翔的家住在臺灣西南沿海的漁村，家族世代以捕捉烏魚維生。每年冬季寒流南下時，烏魚便順著洋流洄游至臺灣海域，長輩會根據天氣變化與海象準備出海。這顯示他們對哪方面有較高的敏感度？", options: ["海洋世界的永續發展", "當地政府的政策變動", "季節性天氣與生態變化", "當地慶典活動的安排"], ans: 2, explanation: "漁民長輩觀察寒流、天氣與海象等待烏魚洄游，顯示對「季節性天氣與生態變化」有高度敏感度。" },

            { type: "MC", q: "【閱讀素養題：烏魚與氣候】阿翔的家族以捕捉烏魚維生，這屬於哪一種產業？", options: ["製造業", "觀光業", "農業", "漁業"], ans: 3, explanation: "出海捕撈烏魚屬於海洋「漁業」。" },
            { type: "MC", q: "【閱讀素養題：烏魚與氣候】從阿翔發現烏魚變少的情況來看，這段文章最可能想提醒我們什麼？", options: ["氣候變遷會影響人們的生活與產業", "海洋生物完全不適合來臺灣", "烏魚已經有毒不適合再食用", "漁村將被淘汰，不適合居住"], ans: 0, explanation: "全球暖化導致烏魚減少、影響漁民生計，提醒我們「氣候變遷會影響人們的生活與產業」。" },
            { type: "MC", q: "【歷史事件影響】「臺灣成為商品貿易的轉運站，並與其他國家交易絲織品、銀與香料。」這主要是受到誰來臺的影響？", options: ["荷蘭人來臺", "西班牙人來臺", "鄭氏政權來臺", "史前人類遷徙"], ans: 0, explanation: "「荷蘭人來臺」將臺灣南部發展為東亞國際貿易的重要轉運站。" },
            { type: "MC", q: "【歷史事件影響】「開啟漢人為主的社會發展，並興建全臺第一座孔廟、設立學校，選拔人才管理地方事務。」這主要是受到誰來臺的影響？", options: ["荷蘭人來臺", "西班牙人來臺", "鄭氏政權來臺", "葡萄牙人航經"], ans: 2, explanation: "「鄭氏政權來臺」帶來大量漢人軍民屯墾，並興建孔廟、推行文教，奠定漢人社會發展基礎。" },
            { type: "MC", q: "【歷史事件影響】「在基隆和平島建造第一座城堡（聖薩爾瓦多城），作為貿易與士兵駐守的據點。」這主要是受到誰來臺的影響？", options: ["荷蘭人來臺", "西班牙人來臺", "鄭氏政權來臺", "施琅攻臺"], ans: 1, explanation: "「西班牙人來臺」首先在基隆和平島建造聖薩爾瓦多城。" },
            { type: "MC", q: "【問答觀念：氣候與生活】為了適應氣候，臺灣早期的老街設計了「騎樓」可以遮陽擋雨。下列哪兩項也是臺灣居民因應氣候而發展出的特色食品或建築？", options: ["新竹居民利用冬季強風與日晒製作柿餅、臺東蘭嶼野銀舊部落防颱的地下屋建築", "臺南孔廟建築、安平古堡的紅磚牆", "淡水紅毛城、基隆和平島的十字架", "卑南遺址的石板棺、十三行遺址的煉鐵爐"], ans: 0, explanation: "新竹九降風晒「柿餅」（或米粉）以及蘭嶼防颱的「地下屋」，皆是順應臺灣氣候環境的生活智慧。" },
            { type: "MC", q: "【問答觀念：鄭氏屯墾地名】鄭氏政權派軍隊到臺灣許多地方從事農業開墾活動，下列哪一組地名皆與當時鄭氏軍隊駐守屯墾的歷史有關？", options: ["臺南新營、高雄左營（及前鎮、林鳳營）", "新北三貂角、臺北士林", "基隆和平島、淡水紅毛城", "雲林北港、臺東長濱"], ans: 0, explanation: "臺南「新營、林鳳營」與高雄「左營、前鎮、後勁」等地名，皆源自鄭氏政權時期的軍隊屯墾鎮營名稱。" }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let correctCount = 0;
        let selectedOption = null;

        function startQuiz() {
            const countValue = document.getElementById('question-count').value;
            let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);

            if (countValue === "all") {
                currentQuizQuestions = shuffled;
            } else {
                const limit = parseInt(countValue);
                currentQuizQuestions = shuffled.slice(0, limit);
            }

            currentIndex = 0;
            correctCount = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            loadQuestion();
        }

        function getCurrentScore() {
            return Math.round((correctCount / currentQuizQuestions.length) * 100);
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-text').innerText = `題目 ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;

            const container = document.getElementById('question-container');
            
            if (qData.type === "TF") {
                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （是非題）${qData.q}</h3>
                    <div class="space-y-3">
                        <button onclick="checkAnswer(true, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">○</span> 正確 (O)
                        </button>
                        <button onclick="checkAnswer(false, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">×</span> 錯誤 (X)
                        </button>
                    </div>
                `;
            } else {
                let optionsHtml = '';
                qData.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx}, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500 shrink-0">${idx + 1}</span> <span>${opt}</span>
                        </button>
                    `;
                });

                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4 whitespace-pre-line">${currentIndex + 1}. （選擇題）${qData.q}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                `;
            }
        }

        function checkAnswer(userAnswer, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = userAnswer;

            const qData = currentQuizQuestions[currentIndex];
            const isCorrect = (userAnswer === qData.ans);

            const buttons = document.querySelectorAll('#question-container button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                correctCount++;
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            // 顯示詳細解說
            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('score-text').innerText = `答對：${correctCount} 題（目前得分：${getCurrentScore()} 分）`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${getCurrentScore()} 分`;
                document.getElementById('final-detail').innerText = `共挑戰 ${currentQuizQuestions.length} 題，答對 ${correctCount} 題`;
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('網址已成功複製！');
        }
    </script>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>社會科線上練習大題庫</title>
    <!-- 引入 Tailwind CSS 與 FontAwesome 圖標 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex flex-col items-center justify-center p-4 min-h-screen">

    <div class="w-full max-w-3xl bg-white rounded-2xl shadow-xl p-6 md:p-8 space-y-6">
        
        <!-- 標題區 -->
        <div class="text-center space-y-2">
            <h1 class="text-2xl md:text-3xl font-bold text-blue-600 flex items-center justify-center gap-2">
                <i class="fa-solid fa-book-open"></i> 社會科 線上練習大題庫
            </h1>
            <p class="text-slate-600 text-sm md:text-base">範圍：翰林版 第 1、2 單元（整合甲卷、乙卷完整試題與解析）</p>
        </div>

        <div id="setup-screen" class="space-y-6">
            <!-- 模式選擇 -->
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-5 space-y-4">
                <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                    <label for="question-count" class="font-semibold text-slate-700 text-lg flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-blue-500"></i> 選擇測驗題數：
                    </label>
                    <select id="question-count" class="w-full md:w-auto min-w-[240px] px-4 py-2.5 bg-white border border-slate-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-700 font-medium">
                        <option value="10">挑戰 10 題（快速隨機練習）</option>
                        <option value="25">挑戰 25 題（精選中量測驗）</option>
                        <option value="all" selected>挑戰全部完整題庫</option>
                    </select>
                </div>
            </div>

            <!-- 開始按鈕 -->
            <button onclick="startQuiz()" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2 text-lg">
                <i class="fa-solid fa-play"></i> 開始新測驗
            </button>
        </div>

        <!-- 測驗進行畫面 (預設隱藏) -->
        <div id="quiz-screen" class="hidden space-y-6">
            <div class="flex justify-between items-center border-b pb-3">
                <span id="progress-text" class="text-slate-500 font-medium">題目 1 / 10</span>
                <span id="score-text" class="text-blue-600 font-bold">目前得分：0 分</span>
            </div>

            <div id="question-container" class="space-y-4">
                <!-- 動態載入題目 -->
            </div>

            <!-- 詳解區 (作答後顯示) -->
            <div id="explanation-box" class="hidden bg-sky-50 border border-sky-200 rounded-xl p-4 text-slate-700 space-y-1">
                <div class="font-bold text-sky-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info"></i> 觀念解析：
                </div>
                <p id="explanation-text" class="text-sm md:text-base"></p>
            </div>

            <div class="flex justify-end pt-2">
                <button id="next-btn" onclick="nextQuestion()" class="hidden px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow transition duration-200">
                    下一題 <i class="fa-solid fa-arrow-right ml-1"></i>
                </button>
            </div>
        </div>

        <!-- 結算畫面 (預設隱藏) -->
        <div id="result-screen" class="hidden text-center space-y-6 py-6">
            <div class="space-y-2">
                <h2 class="text-3xl font-bold text-slate-800">🎉 測驗完成！</h2>
                <p id="final-score" class="text-2xl font-bold text-blue-600"></p>
            </div>
            <button onclick="resetQuiz()" class="px-8 py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg transition duration-200">
                <i class="fa-solid fa-rotate-right mr-1"></i> 重新測驗
            </button>
        </div>

        <!-- 分享與網址區 -->
        <div class="bg-slate-50 border border-slate-200 rounded-xl p-4 flex flex-col md:flex-row items-center justify-between gap-3">
            <span class="text-sm font-medium text-slate-600 flex items-center gap-2">
                <i class="fa-solid fa-globe text-blue-500"></i> 分享測驗網址：
            </span>
            <div class="flex w-full md:w-auto gap-2">
                <input type="text" id="share-url" readonly value="https://sanny874102.github.io/social-study/" class="w-full md:w-80 px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-sm text-slate-600 focus:outline-none">
                <button onclick="copyUrl()" class="px-4 py-1.5 bg-sky-600 hover:bg-sky-700 text-white text-sm font-medium rounded-lg shadow transition flex items-center gap-1 shrink-0">
                    <i class="fa-solid fa-copy"></i> 複製網址
                </button>
            </div>
        </div>

    </div>

    <script>
        // 完整整合題庫資料（包含甲卷、乙卷與單元卷）
        const allQuestions = [
            // 是非題
            { type: "TF", q: "臺南孔廟被稱為「全臺首學」，是清帝國統治臺灣後建立的第一座孔廟。", ans: false, explanation: "臺南孔廟是由鄭氏政權時期（陳永華建議）建立的，並非清帝國統治後才建立[cite: 13, 15]。" },
            { type: "TF", q: "鄭成功在西元 1662 年驅逐西班牙人，在臺建立政權。", ans: false, explanation: "鄭成功在西元 1662 年驅逐的是「荷蘭人」，並在臺建立政權[cite: 13, 15]。" },
            { type: "TF", q: "雅美族（達悟族）人只在每年 3～10 月食用飛魚，讓飛魚不因人類捕食而滅絕。", ans: true, explanation: "這展現了雅美族人永續利用海洋資源的生態智慧[cite: 13, 15]。" },
            { type: "TF", q: "南海與臺灣海峽相連，是臺灣與日本間的重要海域。", ans: false, explanation: "臺灣與日本間的重要海域是「東海」，南海則位於臺灣南方[cite: 13, 15]。" },
            { type: "TF", q: "泰雅族舉行小米祈福祭儀時，由祭司為族人祈福。", ans: false, explanation: "泰雅族的小米祈福或祭儀通常由部落的頭目或長老帶領與祈福[cite: 13, 15]。" },
            { type: "TF", q: "荷蘭人離開臺灣後，原住民族依舊使用羅馬字母作為書寫工具。", ans: true, explanation: "荷蘭人曾用羅馬字拼寫西拉雅語（新港文書），部分地區與後世對此有所接觸[cite: 13, 15]。" },
            { type: "TF", q: "荷蘭人從中國招募漢人來臺開墾，再將蔗糖、鹿皮等轉賣到他國。", ans: true, explanation: "荷蘭人招募漢人開墾土地，並將鹿皮與蔗糖大量外銷至日本及歐洲等地[cite: 13, 15]。" },
            { type: "TF", q: "史前時代的新石器時代，人們仍只會狩獵與採集植物。", ans: false, explanation: "新石器時代的人們已經學會農耕、飼養家畜與定居生活[cite: 13, 15]。" },
            { type: "TF", q: "卑南遺址發現琉璃珠，顯示當時已有跨海交易。", ans: false, explanation: "出土琉璃珠是「十三行遺址」跨海交易的代表證據，卑南遺址以石板棺與玉器聞名[cite: 13, 15]。" },
            { type: "TF", q: "早期臺灣的建築設計會考量氣候，例如：老街的騎樓提供了遮風避雨的功能。", ans: true, explanation: "騎樓能有效遮陽擋雨，是適應臺灣溼熱多雨氣候的建築特色[cite: 13, 15]。" },
            { type: "TF", q: "我們生活的世界可以分為六大洲，包含亞洲、美洲、歐洲、非洲、大洋洲與北極洲。", ans: false, explanation: "世界上分為五大洲，不包含北極洲[cite: 12, 13]。" },
            { type: "TF", q: "西班牙傳教士在基隆和平島建立教堂，傳播天主教。", ans: true, explanation: "西班牙人曾於基隆和平島建立聖薩爾瓦多城並傳播天主教[cite: 12, 13]。" },
            { type: "TF", q: "目前經政府認定在臺灣的原住民族有十四個族群。", ans: false, explanation: "目前經政府官方認定的臺灣原住民族共有十六個族群[cite: 12, 13]。" },
            { type: "TF", q: "三貂角地名是由西班牙語聖地牙哥發音轉化而來。", ans: true, explanation: "三貂角（San Diego）是由西班牙語發音轉化而來的地名[cite: 12, 13]。" },
            { type: "TF", q: "臺灣與菲律賓距離很近，隔著臺灣海峽。", ans: false, explanation: "臺灣與菲律賓之間隔著的是「巴士海峽」[cite: 12, 13]。" },
            { type: "TF", q: "臺灣位於南亞海運的中途要道，吸引各族群來此建立據點，臺灣自十六世紀登上國際舞臺。", ans: false, explanation: "臺灣位於「東亞」海運的中途要道[cite: 12, 13]。" },
            { type: "TF", q: "用來驅邪祈福的劍獅，據說其形象源於鄭氏軍隊在盾牌上畫的獅面。", ans: true, explanation: "臺南安平的劍獅傳說源自鄭氏軍隊盾牌上的獅面圖騰[cite: 12, 13]。" },
            { type: "TF", q: "原住民族順應自然環境而生活，像是泰雅族會將竹子建造成房屋或編織為竹器。", ans: true, explanation: "原住民族擅長取材自然，如泰雅族利用竹子建屋與編織[cite: 12, 13]。" },
            { type: "TF", q: "新石器時代的人們開始將石頭磨製成石器，並從事農耕。", ans: true, explanation: "新石器時代以打磨石器與發展農耕、定居生活為主要特徵[cite: 12, 13]。" },
            { type: "TF", q: "長濱遺址的人們主要以跨海交易維生。", ans: false, explanation: "長濱遺址屬於舊石器時代，主要以捕捉海中生物、採集植物與狩獵維生[cite: 12, 13]。" },

            // 選擇題
            { type: "MC", q: "夏季時，臺灣因什麼季風帶來溫暖潮溼的風與大量降雨，對農業與日常生活有重要的影響？[cite: 1]", options: ["東北季風", "西北季風", "東南季風", "西南季風"], ans: 3, explanation: "夏季吹西南季風，帶來溫暖潮濕的氣候與豐沛降雨[cite: 1]。" },
            { type: "MC", q: "荷蘭人在臺灣建立的兩座城堡名稱是什麼？[cite: 1]", options: ["熱蘭遮城與聖多明哥城", "普羅民遮城與聖薩爾瓦多城", "聖多明哥城與普羅民遮城", "普羅民遮城與熱蘭遮城"], ans: 3, explanation: "荷蘭人主要建立熱蘭遮城（今安平古堡）與普羅民遮城（今赤嵌樓）[cite: 1]。" },
            { type: "MC", q: "荷蘭傳教士如何傳教？[cite: 1]", options: ["設立學校和教堂", "招募原住民族開墾", "與中國商人交易", "以上皆是"], ans: 0, explanation: "荷蘭傳教士透過設立學校教導羅馬字及建立教堂來推行傳教工作[cite: 1]。" },
            { type: "MC", q: "鄭成功來到臺灣後，在臺南設立什麼，作為行政中心？[cite: 1]", options: ["王爺府", "承天府", "代天府", "赤嵌府"], ans: 1, explanation: "鄭成功來臺後改熱蘭遮城為安平鎮，設承天府為行政中心[cite: 1]。" },
            { type: "MC", q: "我們可以藉由什麼方式來推測臺灣史前時代人類的生活方式？[cite: 1]", options: ["求神問卜", "憑空想像", "出土的文物", "參考其他國家的博物館"], ans: 2, explanation: "史前時代沒有文字記錄，考古學家主要依據出土文物來推測當時的生活樣貌[cite: 1]。" },
            { type: "MC", q: "清帝國派誰帶兵進攻臺灣，將臺灣納入清帝國版圖？[cite: 1]", options: ["劉銘傳", "施琅", "鄭經", "沈葆楨"], ans: 1, explanation: "西元 1683 年清帝國派施琅進攻臺灣，鄭克塽投降，臺灣納入清帝國版圖[cite: 1]。" },
            { type: "MC", q: "下列哪一項是東北季風對臺灣的影響？[cite: 1]", options: ["帶來夏季炎熱的氣候", "影響南部冬季使降雨量變少", "增加中部降雨機會", "提高北部與東北部冬季降雨機率"], ans: 3, explanation: "冬季受東北季風影響，北部與東北部會帶來溼冷的雨勢[cite: 1]。" },
            { type: "MC", q: "歐洲航海家經過臺灣時，深受美景吸引並在地圖上記錄，賦予這座島嶼什麼名稱？[cite: 1]", options: ["澎湖群島", "福爾摩沙", "臺灣島", "金門群島"], ans: 1, explanation: "葡萄牙船員驚嘆臺灣之美，稱之為「福爾摩沙」（Formosa，意指美麗島）[cite: 1]。" },
            { type: "MC", q: "因為追逐白鹿而發現饒富魚蝦的日月潭，於是全族搬到這裡定居。這是哪一個原住民族的神話傳說？[cite: 1]", options: ["邵族", "賽德克族", "雅美族（達悟族）", "西拉雅族"], ans: 0, explanation: "這是日月潭在地原住民族「邵族」知名的祖先傳說[cite: 1]。" },
            { type: "MC", q: "新石器時代因為什麼原因，帶動人口成長形成聚落？[cite: 1]", options: ["石器製作", "文字發明", "食物取得漸趨穩定", "跨國貿易興盛"], ans: 2, explanation: "因為學會農耕與畜牧，食物取得穩定，使人類得以定居並帶動聚落發展[cite: 1]。" },
            { type: "MC", q: "臺灣適合向東亞各國進行交流或發展貿易，主要是因為下列哪一項因素？[cite: 3]", options: ["臺灣四面環海，地理位置適中", "與東亞各國語言相同，容易溝通", "臺灣製造的產品價格便宜品質好", "彼此陸地相連"], ans: 0, explanation: "臺灣位於東亞海運要衝，地理位置適中，便於向各國進行交流與貿易[cite: 3]。" },
            { type: "MC", q: "臺灣在大航海時代崛起的主要原因是什麼？[cite: 3]", options: ["物產豐富", "位於航運要道", "土地肥沃", "人口稀少"], ans: 1, explanation: "因位處東亞國際航運要道，在大航海時代成為各國爭相造訪的貿易據點[cite: 3]。" },
            { type: "MC", q: "西班牙人占領淡水後建造第二座城堡，後來荷蘭人趕走西班牙人後，在原址重建城堡是今日的哪裡？[cite: 3]", options: ["聖多明哥城", "聖薩爾瓦多城", "熱蘭遮城", "普羅民遮城"], ans: 0, explanation: "西班牙人建造聖多明哥城（今淡水紅毛城前身），後由荷蘭人重建[cite: 3]。" },
            { type: "MC", q: "西元十六世紀，歐洲國家來到亞洲的主要目的是什麼？[cite: 3]", options: ["探索新大陸", "建立軍事據點", "貿易與獲取資源", "研究新生物物種"], ans: 2, explanation: "歐洲國家大航海的主要動力是尋找香料與進行海外貿易以獲取商業利益[cite: 3]。" },
            { type: "MC", q: "如何描述臺灣島的地理位置？[cite: 3]", options: ["位於亞洲大陸的東側、太平洋的西側", "位於亞洲大陸的西側、太平洋的東側", "位於亞洲大陸的北側、太平洋的西側", "位於太平洋的南側、亞洲大陸的東側"], ans: 0, explanation: "臺灣位於亞洲大陸東側、太平洋西側之海上樞紐[cite: 3]。" },
            { type: "MC", q: "下列哪一項較可能是來自卑南遺址出土的文物？[cite: 3]", options: ["鐮刀", "琉璃珠", "石板棺", "鐵器"], ans: 2, explanation: "卑南遺址屬於新石器時代，以出土大量石板棺與精美玉器聞名[cite: 3]。" },
            { type: "MC", q: "下列哪一個原住民族主要居住在臺東縣蘭嶼鄉？[cite: 3]", options: ["阿美族", "泰雅族", "雅美族（達悟族）", "邵族"], ans: 2, explanation: "雅美族（達悟族）世居於臺東縣蘭嶼鄉，發展出獨特的海洋與飛魚文化[cite: 3]。" },
            { type: "MC", q: "下列關於史前時代的敘述，哪一項錯誤？[cite: 3]", options: ["舊石器時代已知用火", "新石器時代發展農業聚落", "金屬器時代開始煉製鐵器", "長濱遺址的人們生活在地下屋"], ans: 3, explanation: "長濱遺址屬於舊石器時代，當時生活在海蝕洞，地下屋則是特定原住民族的建築而非長濱文化[cite: 3]。" },
            { type: "MC", q: "下列哪項不是原住民族生態保育的智慧？[cite: 3]", options: ["不可獵殺幼小動物", "限制狩獵時間", "共享與互助的文化", "捕魚時，不將飛魚一網打盡"], ans: 2, explanation: "共享與互助屬於部落社會凝聚力量與倫理精神，不屬於直接的生態保育手段[cite: 3]。" },
            { type: "MC", q: "荷蘭人將什麼動、植物引入臺灣？[cite: 3]", options: ["茶葉、黃牛", "龍眼、甘蔗", "土芒果、黃牛", "龍眼、土芒果"], ans: 2, explanation: "荷蘭人統治期間曾引入土芒果與黃牛等外來動植物到臺灣[cite: 3]。" }
        ];

        let currentQuizQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let selectedOption = null;

        function startQuiz() {
            const countValue = document.getElementById('question-count').value;
            let shuffled = [...allQuestions].sort(() => Math.random() - 0.5);

            if (countValue === "all") {
                currentQuizQuestions = shuffled;
            } else {
                const limit = parseInt(countValue);
                currentQuizQuestions = shuffled.slice(0, limit);
            }

            currentIndex = 0;
            score = 0;

            document.getElementById('setup-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            document.getElementById('result-screen').classList.add('hidden');

            loadQuestion();
        }

        function loadQuestion() {
            selectedOption = null;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('explanation-box').classList.add('hidden');
            
            const qData = currentQuizQuestions[currentIndex];
            document.getElementById('progress-text').innerText = `題目 ${currentIndex + 1} / ${currentQuizQuestions.length}`;
            document.getElementById('score-text').innerText = `目前得分：${score} 分`;

            const container = document.getElementById('question-container');
            
            if (qData.type === "TF") {
                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4">${currentIndex + 1}. （是非題）${qData.q}</h3>
                    <div class="space-y-3">
                        <button onclick="checkAnswer(true, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500">○</span> 正確 (O)
                        </button>
                        <button onclick="checkAnswer(false, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500">×</span> 錯誤 (X)
                        </button>
                    </div>
                `;
            } else {
                let optionsHtml = '';
                qData.options.forEach((opt, idx) => {
                    optionsHtml += `
                        <button onclick="checkAnswer(${idx}, this)" class="w-full text-left p-4 bg-slate-50 hover:bg-blue-50 border border-slate-200 rounded-xl font-medium text-slate-700 transition flex items-center gap-3">
                            <span class="w-8 h-8 rounded-full bg-white border border-slate-300 flex items-center justify-center font-bold text-slate-500">${idx + 1}</span> ${opt}
                        </button>
                    `;
                });

                container.innerHTML = `
                    <h3 class="text-lg md:text-xl font-bold text-slate-800 mb-4">${currentIndex + 1}. （選擇題）${qData.q}</h3>
                    <div class="space-y-3">
                        ${optionsHtml}
                    </div>
                `;
            }
        }

        function checkAnswer(userAnswer, btnElement) {
            if (selectedOption !== null) return;
            selectedOption = userAnswer;

            const qData = currentQuizQuestions[currentIndex];
            const isCorrect = (userAnswer === qData.ans);

            const buttons = document.querySelectorAll('#question-container button');
            buttons.forEach(btn => btn.disabled = true);

            if (isCorrect) {
                score += Math.round(100 / currentQuizQuestions.length);
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                btnElement.querySelector('span').classList.add('bg-emerald-500', 'text-white');
            } else {
                btnElement.classList.remove('bg-slate-50', 'hover:bg-blue-50');
                btnElement.classList.add('bg-rose-100', 'border-rose-500', 'text-rose-800');
                btnElement.querySelector('span').classList.add('bg-rose-500', 'text-white');

                buttons.forEach((btn, idx) => {
                    if (qData.type === "TF") {
                        if ((idx === 0 && qData.ans === true) || (idx === 1 && qData.ans === false)) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    } else {
                        if (idx === qData.ans) {
                            btn.classList.remove('bg-slate-50');
                            btn.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-800');
                        }
                    }
                });
            }

            // 顯示詳細解說
            document.getElementById('explanation-text').innerText = qData.explanation;
            document.getElementById('explanation-box').classList.remove('hidden');

            document.getElementById('score-text').innerText = `目前得分：${score} 分`;
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            currentIndex++;
            if (currentIndex < currentQuizQuestions.length) {
                loadQuestion();
            } else {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                document.getElementById('final-score').innerText = `您的總得分：${score} 分`;
            }
        }

        function resetQuiz() {
            document.getElementById('setup-screen').classList.remove('hidden');
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.add('hidden');
        }

        function copyUrl() {
            const urlInput = document.getElementById('share-url');
            urlInput.select();
            urlInput.setSelectionRange(0, 99999);
            navigator.clipboard.writeText(urlInput.value);
            alert('網址已成功複製！');
        }
    </script>
</body>
</html>
